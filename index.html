<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140b24">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Deepa Quest: a journey of lights. Discover why Diwali is celebrated across India and the world through stories and quick mini-games, in English, Hindi, Punjabi, Bengali, Tamil, Gujarati, Nepali and Malay.">
<title>Deepa Quest · A Journey of Lights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ffe066' d='M12 2.5c2.6 3 3.6 5 3.6 6.8a3.6 3.6 0 0 1-7.2 0c0-1.8 1-3.8 3.6-6.8z'/%3E%3Cpath fill='%23ff8a1f' d='M2.5 12.2h19v1.6h-19z'/%3E%3Cpath fill='%239a6431' d='M3 13.8h18c-.6 3.6-4.4 6.2-9 6.2s-8.4-2.6-9-6.2z'/%3E%3C/svg%3E">
<style>
:root{--bg:#140b24;--p2:#2c1c49;--line:#41306a;--gold:#ffc24b;--rose:#ff5d7a;--ok:#4fdc9b;--tx:#fff4e0;--mu:#c3b3dc;--hud:calc(66px + env(safe-area-inset-top))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}html.big{font-size:18.5px}
html,body{height:100%;background:#07040d;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Nirmala UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Gurmukhi","Noto Sans Gujarati","Noto Sans Tamil",sans-serif;overflow:hidden;overscroll-behavior:none}
:is(:lang(hi),:lang(pa),:lang(bn),:lang(ta),:lang(gu),:lang(ne)) *{letter-spacing:0!important;text-transform:none!important}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
@media (min-width:600px) and (min-height:700px){#app{height:min(100dvh - 40px,900px);border-radius:28px;box-shadow:0 0 0 1px #2d1d4a,0 30px 90px #000c}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
svg.i{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:-.25em;overflow:visible}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;border-radius:16px;background:var(--p2);border:1px solid var(--line);font-weight:800;font-size:1rem;line-height:1.25;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,#ffcf5a,#ff8a1f 55%,#ff4e50);border:0;color:#2a0f00;box-shadow:0 5px 0 #a33a00,0 10px 26px #ff7a1855}
.btn.pri:active{transform:translateY(4px);box-shadow:0 1px 0 #a33a00}
.btn.ghost{background:transparent;border-color:#ffffff2a}
.btn.sel{border-color:var(--gold);background:#3a2758}
.btn.danger{background:#7c1d33;border-color:var(--rose)}
.btn b{color:var(--gold)}
.row{display:flex;gap:10px;width:100%}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.ib{flex:none;width:44px;height:44px;border-radius:14px;background:#ffffff17;display:grid;place-items:center;font-size:1.15rem}
.ib:active{transform:scale(.92)}
.chip{flex:none;height:34px;padding:0 12px;border-radius:99px;background:#ffffff17;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.88rem}
.chip .i{color:var(--gold)}
.pill{flex:none;min-height:44px;padding:0 14px;border-radius:99px;background:#00000059;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.82rem;white-space:nowrap}
.pill:active{transform:scale(.95)}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars .i{color:#ffffff33;width:1em;height:1em}.stars .i.on{color:var(--gold)}
.hero{line-height:0;filter:drop-shadow(0 0 28px #ff9d2e);animation:bob 2.6s ease-in-out infinite}
.hero .i{width:96px;height:96px}
@keyframes bob{50%{transform:translateY(-10px) scale(1.04)}}
/* title */
#s-title{align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(90% 55% at 50% 105%,#ff8a1f40,transparent 70%),radial-gradient(circle at 50% 15%,#3d2068,var(--bg) 70%)}
.sky{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 42% 28%,#fffa,transparent),radial-gradient(1.2px 1.2px at 88% 38%,#fff,transparent),radial-gradient(1.6px 1.6px at 22% 46%,#fffa,transparent),radial-gradient(1.2px 1.2px at 64% 8%,#fff,transparent),radial-gradient(1.3px 1.3px at 6% 64%,#fff8,transparent),radial-gradient(1.3px 1.3px at 94% 70%,#fff8,transparent);animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
.tc{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}
.logo{font-size:clamp(2.2rem,11vw,3rem);font-weight:900;letter-spacing:-1px;margin-top:10px;background:linear-gradient(180deg,#fff3c4,#ffb22e 55%,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mu);margin:4px 0 26px;line-height:1.4}
.foot{margin-top:20px;font-size:.78rem;color:var(--mu)}
/* map */
#s-map{background:linear-gradient(180deg,#44200f 0%,#3a1c3c 30%,#26305e 52%,#0f4a63 66%,#1c2a5c 82%,#0a0614 100%)}
.mhead{flex:none;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#140b24f2;border-bottom:1px solid #ffffff14;z-index:3}
.mlogo{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:900;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlogo .i{color:var(--gold)}
.mscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mapw{position:relative;width:100%}
.mapw svg.pth{position:absolute;left:0;top:0;pointer-events:none}
.pb{fill:none;stroke:#ffffff35;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 14}
.pl{fill:none;stroke:#ffc24b;stroke-width:7;stroke-linecap:round;stroke-dasharray:1 14}
.node{position:absolute;width:132px;transform:translate(-50%,-37px);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.orb{position:relative;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,#ffffff60,transparent 42%),var(--c);border:3px solid #ffffff60;box-shadow:0 6px 0 #00000070}
.orb>.i{width:42px;height:42px;filter:drop-shadow(0 2px 2px #0006)}
.node.done .orb{border-color:var(--gold);box-shadow:0 6px 0 #00000070,0 0 26px #ffc24b90}
.node.cur .orb{border-color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 6px 0 #00000070,0 0 0 0 #ffc24bcc}100%{box-shadow:0 6px 0 #00000070,0 0 0 18px #ffc24b00}}
.node.lock .orb{filter:grayscale(1) brightness(.5)}
.node.new .orb{animation:unlock .8s cubic-bezier(.2,1.6,.4,1),pulse 1.5s .8s infinite}
@keyframes unlock{0%{transform:scale(.3) rotate(-30deg)}}
.nm{font-size:.8rem;font-weight:800;line-height:1.2;text-shadow:0 2px 6px #000,0 0 2px #000}
.nm small{display:block;font-size:.72rem;font-weight:700;color:#ffe9c2;opacity:.9}
.st{min-height:1em;font-size:.95rem;filter:drop-shadow(0 1px 3px #000)}
.lk{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:#1a1030;display:grid;place-items:center;color:#fff;font-size:.8rem}
.now{position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a0f00;font-weight:900;font-size:.68rem;letter-spacing:1px;padding:4px 10px;border-radius:99px;box-shadow:0 3px 10px #0008;animation:nowb 1.1s ease-in-out infinite;white-space:nowrap}
@keyframes nowb{50%{transform:translate(-50%,-5px)}}
.chap{position:absolute;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:88%;text-align:center;line-height:1.3;font-size:.7rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;background:#0000006b;border:1px solid #ffffff2e;padding:7px 14px;border-radius:18px}
.deco{position:absolute;transform:translate(-50%,-50%);opacity:.4;pointer-events:none;line-height:0}
.deco .i{width:30px;height:30px}
/* story */
#s-story{background:var(--sbg);cursor:pointer}
.sbars{flex:none;display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px}
.sbars i{flex:1;height:3px;border-radius:3px;background:#ffffff40}
.sbars i.f{background:#fff}
.stop{flex:none;display:flex;align-items:center;gap:8px;padding:2px 12px}
.place{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800}
.place span{background:#00000059;padding:7px 11px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sart{flex:1;min-height:0;display:grid;place-items:center;padding:10px}
.art{display:flex;gap:6px;align-items:center;justify-content:center;animation:artIn .5s cubic-bezier(.2,1.4,.4,1),float 3.2s .5s ease-in-out infinite;filter:drop-shadow(0 12px 24px #000a)}
.art .i{width:var(--s);height:var(--s)}
@keyframes artIn{from{opacity:0;transform:scale(.6) translateY(20px)}}
@keyframes float{50%{transform:translateY(-8px)}}
.stext{flex:none;margin:0 12px calc(12px + env(safe-area-inset-bottom));background:#0c0717e6;border:1px solid #ffffff1f;border-radius:22px;padding:14px 14px 10px;font-size:1.08rem;line-height:1.55;animation:txIn .35s ease;cursor:default}
@keyframes txIn{from{opacity:0;transform:translateY(12px)}}
.who{display:block;font-size:.72rem;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.snav{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.sbtn{min-height:44px;padding:0 14px;border-radius:14px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:.9rem;background:#ffffff12}
.sbtn.go{background:var(--gold);color:#2a0f00}
.mis{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 20px calc(20px + env(safe-area-inset-bottom));gap:12px;cursor:default}
.mis .hero .i{width:84px;height:84px}
.mt{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:900;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.mx{font-size:1.2rem;font-weight:800;line-height:1.45;max-width:340px}
.mgoal{font-size:.88rem;color:var(--mu);margin-bottom:6px}
/* game shell */
#s-game{background:#05030a}
#g-stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.ghud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#000000b3,#0000);pointer-events:none}
.ghud .ib{pointer-events:auto}
.gmid{flex:1;min-width:0}
.gname{font-size:.74rem;font-weight:800;color:#fffd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.gbar{height:8px;border-radius:8px;background:#ffffff2b;overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ff8a1f);border-radius:8px;transform-origin:left center}
.gbar.low i{background:linear-gradient(90deg,#ff8a9b,#ff2d55)}
.gchip{flex:none;height:36px;min-width:40px;padding:0 10px;border-radius:12px;background:#ffffff21;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:900;font-size:.85rem;white-space:nowrap}
.gchip .i{width:1.15em;height:1.15em;color:var(--gold)}
#g-lives .i{color:#ff4d6d}#g-lives .i.off{color:#ffffff30}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.field{position:absolute;left:0;right:0;bottom:0;top:var(--hud)}
.ready{position:absolute;inset:0;z-index:6;display:grid;place-items:center;font-size:3rem;font-weight:900;text-shadow:0 6px 30px #000;animation:popIn .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.gdeco{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;opacity:.28;pointer-events:none;overflow:hidden}
.gdeco .i{width:44px;height:44px}
.pop{position:absolute;z-index:7;transform:translate(-50%,-50%);font-weight:900;font-size:1.25rem;pointer-events:none;text-shadow:0 2px 8px #000;animation:popUp .9s ease-out forwards;white-space:nowrap}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%)}}
.pop.good{color:#ffe066}.pop.bad{color:#ff5d7a}.pop.big{font-size:1.7rem}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;animation:fl .4s forwards}
@keyframes fl{from{opacity:.5}to{opacity:0}}
.shakeit{animation:shk .3s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
.paused,.paused *{animation-play-state:paused!important}
/* tap */
.tgt{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;display:grid;place-items:center;animation:tIn .25s cubic-bezier(.2,1.7,.4,1);transition:opacity .25s,transform .25s,filter .2s}
.tgt .i{width:54px;height:54px}
@keyframes tIn{from{transform:scale(0)}}
.tgt.dim{filter:grayscale(1) brightness(.6)}
.tgt.lit{filter:drop-shadow(0 0 16px #ffb52e) brightness(1.2);transform:scale(1.4)}
.tgt.out{transform:scale(.4);opacity:0}
.tgt.boom{transform:scale(1.3) rotate(25deg);filter:drop-shadow(0 0 14px #ff2d55)}
/* rhythm */
.rh{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.l14{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:300px;margin-bottom:22px}
.l14 .i{width:24px;height:24px;filter:grayscale(1) brightness(.35);transition:filter .3s}
.l14 .i.on{filter:drop-shadow(0 0 8px #ffb52e)}
.rw{position:relative;width:min(62vw,250px);aspect-ratio:1}
.rtg{position:absolute;inset:0;border-radius:50%;border:6px solid #ffc24b;display:grid;place-items:center;background:radial-gradient(circle,#ff3b3b33,transparent 70%);box-shadow:0 0 34px #ff3b3b55}
.rtg .i{width:56%;height:56%}
.rtg.hit{animation:hitp .14s}
@keyframes hitp{50%{transform:scale(.93)}}
.ring{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;pointer-events:none;will-change:transform,opacity}
.rj{height:44px;font-size:1.6rem;font-weight:900;margin-top:20px}
.rj.hit{animation:hitp2 .25s}
@keyframes hitp2{from{transform:scale(1.35)}}
.rsub{font-size:.88rem;color:var(--mu);text-align:center}
/* swipe */
.sw{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.deck{position:relative;width:min(84vw,330px);height:min(52vh,370px)}
.sc{position:absolute;inset:0;border-radius:24px;background:linear-gradient(160deg,#fff7e6,#ffe1b0);color:#2a1400;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-shadow:0 14px 30px #0008;will-change:transform;touch-action:none}
.sc:not(.back){animation:deal .22s ease-out}
@keyframes deal{from{transform:scale(.94) translateY(14px)}}
.sc.back{transform:scale(.94) translateY(14px);filter:brightness(.75)}
.se{margin-bottom:14px;line-height:0}.se .i{width:64px;height:64px}
.sq{font-size:1.18rem;font-weight:800;line-height:1.4}
.sn{position:absolute;bottom:14px;font-size:.75rem;font-weight:800;opacity:.5}
.lbl{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:900;border:3px solid;opacity:0}
.lbl.t{right:18px;color:#13a35b;transform:rotate(12deg)}
.lbl.f{left:18px;color:#e0244a;transform:rotate(-12deg)}
.swb{display:flex;gap:30px;margin-top:18px}
.swb button{width:68px;height:68px;border-radius:50%;font-size:28px;background:#ffffff1a;border:2px solid #ffffff33;display:grid;place-items:center}
.swb .yes{color:var(--ok)}.swb .no{color:var(--rose)}
.why{min-height:3.2em;margin-top:14px;text-align:center;font-size:.95rem;max-width:340px;line-height:1.45}
.why.good{color:#7dffb8}.why.bad{color:#ff9aac}
/* rangoli */
.rg{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
.rgt{font-weight:900;font-size:1.05rem}
.rgrid{position:relative;display:grid;gap:4px;width:min(94vw,400px);padding:10px;border-radius:18px;background:#ffffff0d;border:1px solid #ffffff1f}
.rgrid::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;border-left:2px dashed #ffffffa0;pointer-events:none}
.rgrid.win{box-shadow:0 0 40px #ffc24b99;border-color:var(--gold)}
.rc{aspect-ratio:1;border-radius:9px;background:#ffffff14;border:1px solid #ffffff1a;transition:transform .1s}
.rc:active{transform:scale(.88)}
.rc.lh{pointer-events:none}
.rpal{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;font-size:.85rem;color:var(--mu)}
.rpal i{width:18px;height:18px;border-radius:5px;display:inline-block;border:1px solid #ffffff40}
.rhint{min-height:1.4em;font-weight:800;color:var(--gold);text-align:center}
/* quiz */
.qz{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.ql{display:flex;justify-content:center;gap:5px}
.ql .i{width:20px;height:20px;filter:grayscale(1) brightness(.4)}
.ql .i.y{filter:drop-shadow(0 0 6px #ffb52e)}
.ql .i.n{opacity:.25}
.qn{text-align:center;color:var(--mu);font-size:.75rem;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.qq{font-size:clamp(1.12rem,5vw,1.4rem);font-weight:900;text-align:center;line-height:1.4;min-height:3em;display:grid;place-items:center;animation:txIn .3s}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qo{min-height:76px;border-radius:18px;background:#ffffff17;border:2px solid #ffffff26;padding:10px 8px;font-weight:800;font-size:1rem;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .1s,background .2s}
.qo:active{transform:scale(.95)}
.qo.ok{background:#1d7a4c;border-color:var(--ok)}
.qo.no{background:#7c1d33;border-color:var(--rose)}
.qw{min-height:3em;text-align:center;font-size:.92rem;line-height:1.45}
/* simon */
.sm{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.si{font-size:1.2rem;font-weight:900;min-height:1.5em;text-align:center}
.arch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(88vw,340px);padding:30px 16px 18px;border:7px solid #b8862f;border-bottom:0;border-radius:170px 170px 0 0;background:linear-gradient(#ffffff08,#0000)}
.pad{aspect-ratio:1;border-radius:50% 50% 16px 16px;background:#2a1a08;border:3px solid #6e5122;display:grid;place-items:center;filter:grayscale(.9) brightness(.55);transition:filter .12s,transform .12s,box-shadow .12s}
.pad,.lc{min-height:0}.pad .i,.lc .i{height:auto;aspect-ratio:1}.pad .i{width:60%}
.pad.on{filter:none;transform:scale(1.1);box-shadow:0 0 34px var(--pc),inset 0 0 20px var(--pc);border-color:var(--pc)}
.ss{font-size:.88rem;color:var(--mu);text-align:center}
/* memory */
.mm{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
.mgr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(94vw,400px)}
.mcd{aspect-ratio:3/4;perspective:700px;padding:0}
.mcd .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcd.f .in{transform:rotateY(180deg)}
.mcd .fa,.mcd .ba{position:absolute;inset:0;border-radius:12px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;text-align:center}
.mcd .ba{background:linear-gradient(135deg,#ff8a1f,#c2185b);border:2px solid #ffffff55}
.mcd .ba .i{width:46%;height:46%}
.mcd .fa{transform:rotateY(180deg);background:#fff6e3;color:#2a1400;font-weight:700;font-size:.72rem;line-height:1.25;overflow-wrap:anywhere}
.mcd .fa b{font-size:.82rem;font-weight:900;color:#a8320a}
.mcd .fa .i{color:#b06a14;width:18px;height:18px}
.mcd.m .fa{background:#dcffeb;box-shadow:inset 0 0 0 3px #4fdc9b}
/* lights */
.lo{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px}
.lg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(86vw,330px)}
.lc{aspect-ratio:1;border-radius:16px;background:#1b1430;border:2px solid #392c57;display:grid;place-items:center;transition:background .15s,box-shadow .15s}
.lc .i{width:58%;filter:grayscale(1) brightness(.45);transition:filter .15s}
.lc.on{background:radial-gradient(circle,#ffe7a0,#ff9f1c 75%);border-color:#ffd166;box-shadow:0 0 22px #ffb52e88}
.lc.on .i{filter:none}
.lc.hint{outline:3px dashed #fff;outline-offset:3px}
.lrow{display:flex;gap:10px;width:min(86vw,330px)}
/* modal, album, toast */
.modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#07030fe6}
.modal.on{display:flex;animation:fadeIn .2s}
.mcard{width:100%;max-width:370px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#2e1d4d,#1a0f2e);border:1px solid #ffffff26;border-radius:26px;padding:22px 16px 16px;text-align:center;animation:popIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes popIn{from{opacity:0;transform:scale(.75)}}
.rt{font-size:1.6rem;font-weight:900;line-height:1.3;background:linear-gradient(180deg,#fff3c4,#ffb22e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rst{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0 4px;height:76px}
.rst .i{width:52px;height:52px;color:#ffffff2a;transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.8,.4,1),color .3s,filter .3s}
.rst .i.on{color:var(--gold);filter:drop-shadow(0 0 12px #ffc24b);transform:scale(1)}
.rst .i:nth-child(2){margin-bottom:14px}
.rst .i:nth-child(2).on{transform:scale(1.18)}
.rl{color:var(--mu);font-weight:700;font-size:.92rem;margin-bottom:6px;line-height:1.4}
.fc{margin:12px 0 14px;text-align:left;background:linear-gradient(135deg,#3d2604,#241640);border:1px solid #ffc24b70;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.fe{line-height:0}.fe .i{width:42px;height:42px}
.fc h4{color:var(--gold);font-size:.98rem;margin-bottom:4px;line-height:1.35}
.fc h4 em{display:block;font-style:normal;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:#7dffb8}
.fc p{font-size:.9rem;line-height:1.5;color:#f4e9ff}
.unl{display:flex;align-items:center;justify-content:center;gap:6px;margin:-4px 0 14px;font-weight:800;color:#7dffb8;font-size:.9rem}
.rf{margin:12px 0 16px;line-height:1.55;color:#f4e9ff}
.hap{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;margin:4px 0 14px;font-weight:800;color:var(--gold);font-size:.92rem}
#s-album{background:linear-gradient(180deg,#1d1036,#0b0614)}
.ah{padding:14px 16px 0;color:var(--mu);font-size:.9rem;line-height:1.45}
.ag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.ac{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(160deg,#4a2c05,#2a1a45);border:1px solid #ffc24b66;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center}
.ac:active{transform:scale(.95)}
.ac>.i{width:38px;height:38px}
.at{font-size:.7rem;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.ac.off{background:#1b1229;border-color:#ffffff14;opacity:.55}
.ac.off>.i{color:#fff;width:28px;height:28px}
.toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:6px;max-width:92%;background:#000d;border:1px solid #ffffff30;padding:10px 16px;border-radius:99px;font-weight:700;font-size:.9rem;white-space:nowrap;animation:toast 2.2s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.hero,.art,.sky,.node.cur .orb,.node.new .orb,.now,.scr.on,.mcard,.stext{animation:none!important}}

 for(const p of parts){p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;fc.globalAlpha=p.l;fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.283);fc.fill()}

 tr:{
 hi:{w:'कहीं अँधेरे में',s:['हर महीने एक बिना चाँद की रात आती है, जिसे अमावस्या कहते हैं। पर साल में एक बार, शरद ऋतु में, उनमें से एक रात सबसे रोशन रात बन जाती है।','उस रात पूरे भारत में, और दुनिया भर के शहरों में, अनगिनत दीपक जलाए जाते हैं।','पर क्यों? दस लोगों से पूछिए, शायद दस अलग कहानियाँ सुनने को मिलें। और सभी सच्ची।','मैं ज्योति हूँ, दीपक की आत्मा। मेरे साथ चलिए। हर कहानी जानिए, उसकी परीक्षा पार कीजिए, और हर दीप कार्ड इकट्ठा कीजिए।']},
 pa:{w:'ਕਿਤੇ ਹਨੇਰੇ ਵਿੱਚ',s:['ਹਰ ਮਹੀਨੇ ਇੱਕ ਬਿਨਾਂ ਚੰਨ ਦੀ ਰਾਤ ਆਉਂਦੀ ਹੈ, ਜਿਸਨੂੰ ਮੱਸਿਆ ਕਹਿੰਦੇ ਹਨ। ਪਰ ਸਾਲ ਵਿੱਚ ਇੱਕ ਵਾਰ, ਪਤਝੜ ਦੀ ਰੁੱਤੇ, ਉਨ੍ਹਾਂ ਵਿੱਚੋਂ ਇੱਕ ਰਾਤ ਸਭ ਤੋਂ ਰੌਸ਼ਨ ਰਾਤ ਬਣ ਜਾਂਦੀ ਹੈ।','ਉਸ ਰਾਤ ਪੂਰੇ ਭਾਰਤ ਵਿੱਚ, ਅਤੇ ਦੁਨੀਆ ਭਰ ਦੇ ਸ਼ਹਿਰਾਂ ਵਿੱਚ, ਅਣਗਿਣਤ ਦੀਵੇ ਜਗਾਏ ਜਾਂਦੇ ਹਨ।','ਪਰ ਕਿਉਂ? ਦਸ ਲੋਕਾਂ ਨੂੰ ਪੁੱਛੋ, ਸ਼ਾਇਦ ਦਸ ਵੱਖਰੀਆਂ ਕਹਾਣੀਆਂ ਸੁਣਨ ਨੂੰ ਮਿਲਣ। ਅਤੇ ਸਾਰੀਆਂ ਸੱਚੀਆਂ।','ਮੈਂ ਜੋਤੀ ਹਾਂ, ਦੀਵੇ ਦੀ ਆਤਮਾ। ਮੇਰੇ ਨਾਲ ਚੱਲੋ। ਹਰ ਕਹਾਣੀ ਜਾਣੋ, ਉਸਦੀ ਪਰਖ ਪਾਰ ਕਰੋ, ਅਤੇ ਹਰ ਦੀਵਾ ਕਾਰਡ ਇਕੱਠਾ ਕਰੋ।']},
 bn:{w:'অন্ধকারে কোথাও',s:['প্রতি মাসে আসে এক চাঁদহীন রাত, যার নাম অমাবস্যা। কিন্তু বছরে একবার, হেমন্তে, তাদের একটি হয়ে ওঠে সবচেয়ে উজ্জ্বল রাত।','সেই রাতে সারা ভারতে, আর পৃথিবীর নানা শহরে, জ্বলে ওঠে অগণিত প্রদীপ।','কিন্তু কেন? দশজনকে জিজ্ঞেস করো, হয়তো দশটি আলাদা গল্প শুনবে। আর সবগুলোই সত্যি।','আমি জ্যোতি, প্রদীপের আত্মা। আমার সঙ্গে চলো। প্রতিটি গল্প জানো, তার পরীক্ষায় উতরে যাও, আর প্রতিটি প্রদীপ কার্ড সংগ্রহ করো।']},
 ta:{w:'இருளில் எங்கோ',s:['ஒவ்வொரு மாதமும் நிலவில்லாத ஓர் இரவு வருகிறது, அதன் பெயர் அமாவாசை. ஆனால் ஆண்டுக்கு ஒருமுறை, இலையுதிர் காலத்தில், அவற்றில் ஒன்று எல்லாவற்றிலும் ஒளிமிக்க இரவாகிறது.','அந்த இரவில் இந்தியா முழுவதும், உலகின் பல நகரங்களிலும், எண்ணற்ற விளக்குகள் ஏற்றப்படுகின்றன.','ஆனால் ஏன்? பத்து பேரிடம் கேள், பத்து வெவ்வேறு கதைகள் கேட்கலாம். அவை அனைத்தும் உண்மை.','நான் ஜோதி, விளக்கின் ஆவி. என்னுடன் பயணம் செய். ஒவ்வொரு கதையையும் அறிந்து, அதன் சோதனையில் வென்று, ஒவ்வொரு விளக்கு அட்டையையும் சேகரி.']},
 gu:{w:'ક્યાંક અંધારામાં',s:['દર મહિને એક ચાંદ વિનાની રાત આવે છે, જેને અમાસ કહે છે. પણ વર્ષમાં એક વાર, શરદ ઋતુમાં, તેમાંની એક રાત સૌથી ઝળહળતી રાત બની જાય છે.','તે રાતે આખા ભારતમાં, અને દુનિયાભરનાં શહેરોમાં, અગણિત દીવા પ્રગટાવાય છે.','પણ કેમ? દસ લોકોને પૂછો, કદાચ દસ જુદી વાર્તાઓ સાંભળવા મળે. અને બધી સાચી.','હું જ્યોતિ છું, દીવાનો આત્મા. મારી સાથે ચાલો. દરેક વાર્તા જાણો, તેની કસોટી પાર કરો, અને દરેક દીવા કાર્ડ ભેગું કરો.']},
 ne:{w:'अँध्यारोमा कतै',s:['हरेक महिना जून नलाग्ने एउटा रात आउँछ, जसलाई औंसी भनिन्छ। तर वर्षमा एक पटक, शरद ऋतुमा, तीमध्ये एउटा रात सबैभन्दा उज्यालो रात बन्छ।','त्यो रात भारतभरि, र संसारभरिका सहरहरूमा, अनगिन्ती दियो बालिन्छन्।','तर किन? दस जनालाई सोध्नुहोस्, सायद दस फरक कथा सुन्नुहुनेछ। र सबै साँचो।','म ज्योति हुँ, दियोको आत्मा। मसँगै यात्रा गर्नुहोस्। हरेक कथा जान्नुहोस्, त्यसको परीक्षा पार गर्नुहोस्, र हरेक दियो कार्ड जम्मा गर्नुहोस्।']},
 ms:{w:'Di suatu tempat dalam gelap',s:['Setiap bulan ada satu malam tanpa bulan yang dipanggil Amavasya. Tetapi setahun sekali, pada musim luruh, salah satunya menjadi malam paling terang.','Pada malam itu, pelita yang tidak terkira banyaknya dinyalakan di seluruh India dan di bandar-bandar seluruh dunia.','Tetapi mengapa? Tanya sepuluh orang dan anda mungkin mendengar sepuluh cerita berbeza. Semuanya benar.','Saya Jyoti, semangat pelita. Mengembaralah bersama saya. Pelajari setiap cerita, lulus ujiannya, dan kumpul setiap kad pelita.']}}};

 tr:{hi:{n:'अयोध्या',w:'उत्तर प्रदेश, भारत',s:['राजकुमार राम को चौदह लंबे वर्षों के लिए वनवास पर भेजा गया।','जब दस सिरों वाले राक्षस राजा रावण ने सीता का हरण किया, तो राम ने लंका में उससे युद्ध किया और विजयी हुए।','आख़िरकार राम अयोध्या लौटे। पर उस रात अमावस्या थी, बिना चाँद की रात। घुप अँधेरा।','इसलिए अयोध्या के लोगों ने उन्हें घर का रास्ता दिखाने के लिए मिट्टी के दीयों की कतारें जलाईं। दीप यानी दीपक, आवली यानी कतार। दीपावली!'],m:'अयोध्या के घाटों को रोशन करें! बुझते दीयों को समय रहते टैप करके जलाएँ।',g:'25 दीये जलाएँ',u:'दीये जले',c:['दीपावली = “दीपों की पंक्ति”','संस्कृत से: दीप (दीपक) + आवली (पंक्ति)। आज अयोध्या का दीपोत्सव सरयू नदी के किनारे लाखों दीये जलाता है।']}}},

 tr:{hi:{n:'गोवर्धन',w:'ब्रज (मथुरा), भारत',s:['ब्रज के गाँवों में ग्वाले हर साल आकाश के राजा इंद्र को भेंट चढ़ाते थे।','नन्हे कृष्ण ने पूछा: इसके बजाय गोवर्धन पर्वत को धन्यवाद क्यों न दें? वही हमारी गायों को चारा देता है और हमें आश्रय देता है।','इंद्र क्रोधित हो गए। उन्होंने ऐसा तूफ़ान भेजा जो सात दिन और सात रात चलता रहा।','कृष्ण ने पूरा पर्वत अपनी छोटी उँगली पर छतरी की तरह उठा लिया। उसके नीचे सब सुरक्षित रहे।','इसलिए दिवाली के अगले दिन गोवर्धन पूजा होती है। लोग पकवानों का एक “पहाड़” बनाते हैं, जिसे अन्नकूट कहते हैं।'],m:'पर्वत को दाएँ-बाएँ खींचें। गाँव में बाढ़ आने से पहले इंद्र की बारिश रोकें!',g:'7 दिन टिके रहें',c:['अन्नकूट: भोजन का पर्वत','गोवर्धन पूजा पर घरों और मंदिरों में दर्जनों पकवान पर्वत के आकार में सजाकर भोग लगाया जाता है, भोजन और आश्रय के लिए धन्यवाद देते हुए।']}}},

 card:['meditate','Vir Nirvan Samvat','The Jain calendar counts its years from Mahavira’s nirvana. Its new year begins the day after Diwali.'],
 tr:{hi:{n:'पावापुरी',w:'बिहार, भारत',s:['महावीर जैन धर्म के 24वें तीर्थंकर थे, एक महान शिक्षक।','पावापुरी में, दिवाली की अमावस्या की रात, उन्होंने मोक्ष प्राप्त किया: जन्म और मृत्यु के चक्र से मुक्ति।','वहाँ मौजूद अठारह राजाओं ने कहा: “ज्ञान का प्रकाश चला गया। आइए, उसकी जगह दीप जलाएँ।”','इसलिए जैनों के लिए दिवाली महावीर के निर्वाण का दिन है, और जैन नव वर्ष अगले ही दिन शुरू होता है।'],m:'ज्ञान कार्ड! सही हो तो दाएँ स्वाइप करें, गलत हो तो बाएँ। कुछ कार्ड पिछली कहानियों के बारे में भी हैं।',g:'8 कार्ड परखें',c:['वीर निर्वाण संवत','जैन पंचांग अपने वर्ष महावीर के निर्वाण से गिनता है। इसका नया वर्ष दिवाली के अगले दिन शुरू होता है।'],
  x:[['महावीर 24वें तीर्थंकर थे।','हाँ, 24 महान जैन शिक्षकों में अंतिम।'],['अयोध्या ने दीये इसलिए जलाए क्योंकि पूर्णिमा की रात थी।','नहीं। वह अमावस्या थी, बिना चाँद की रात।'],['महावीर ने बिहार के पावापुरी में मोक्ष प्राप्त किया।','सही। पावापुरी एक प्रमुख जैन तीर्थ है।'],['“दीपावली” का अर्थ है “मिठाइयों का त्योहार”।','ललचाने वाला है! पर इसका अर्थ है “दीपों की पंक्ति”।'],['राजाओं ने दीप इसलिए जलाए क्योंकि ज्ञान का प्रकाश संसार से चला गया था।','हाँ। ज्ञान के प्रकाश की जगह दीपक।'],['जैन राम की वापसी के लिए दिवाली मनाते हैं।','नहीं। जैनों के लिए दिवाली महावीर का निर्वाण है।'],['कृष्ण ने गोवर्धन पर्वत अपनी छोटी उँगली पर उठाया।','हाँ, सबको इंद्र के तूफ़ान से बचाने के लिए।'],['जैन नव वर्ष दिवाली के अगले दिन शुरू होता है।','सही। वीर निर्वाण संवत नए सिरे से शुरू होता है।']]}}},

 tr:{pa:{n:'ਅੰਮ੍ਰਿਤਸਰ',w:'ਗਵਾਲੀਅਰ → ਅੰਮ੍ਰਿਤਸਰ, ਭਾਰਤ',s:['ਛੇਵੇਂ ਸਿੱਖ ਗੁਰੂ, ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਨੂੰ ਮੁਗ਼ਲ ਬਾਦਸ਼ਾਹ ਜਹਾਂਗੀਰ ਨੇ ਗਵਾਲੀਅਰ ਦੇ ਕਿਲ੍ਹੇ ਵਿੱਚ ਕੈਦ ਕੀਤਾ।','ਜਦੋਂ ਉਨ੍ਹਾਂ ਨੂੰ ਰਿਹਾਅ ਕੀਤਾ ਗਿਆ, ਉਨ੍ਹਾਂ ਨੇ ਇਕੱਲੇ ਜਾਣ ਤੋਂ ਇਨਕਾਰ ਕਰ ਦਿੱਤਾ। ਉਨ੍ਹਾਂ ਨਾਲ ਕੈਦ 52 ਰਾਜਿਆਂ ਨੂੰ ਵੀ ਆਜ਼ਾਦ ਕਰਨਾ ਪਵੇਗਾ।','ਸ਼ਰਤ ਇਹ ਸੀ: ਸਿਰਫ਼ ਉਹੀ ਜਾ ਸਕਦੇ ਸਨ ਜੋ ਗੁਰੂ ਜੀ ਦਾ ਚੋਲਾ ਫੜਨ। ਇਸ ਲਈ ਉਨ੍ਹਾਂ ਨੇ 52 ਕਲੀਆਂ ਵਾਲਾ ਚੋਲਾ ਪਹਿਨਿਆ। ਹਰ ਰਾਜੇ ਲਈ ਇੱਕ।','ਉਹ ਦੀਵਾਲੀ ਵੇਲੇ ਅੰਮ੍ਰਿਤਸਰ ਪਹੁੰਚੇ, ਅਤੇ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀਵਿਆਂ ਨਾਲ ਜਗਮਗਾ ਉੱਠਿਆ। ਸਿੱਖ ਇਸਨੂੰ ਬੰਦੀ ਛੋੜ ਦਿਵਸ ਵਜੋਂ ਮਨਾਉਂਦੇ ਹਨ: ਮੁਕਤੀ ਦਾ ਦਿਨ।'],m:'ਰਾਜਿਆਂ ਨੂੰ ਆਜ਼ਾਦ ਕਰੋ! ਹਰ ਤਾਜ ਵਾਲੇ ਰਾਜੇ ਤੇ ਟੈਪ ਕਰੋ। ਪਹਿਰੇਦਾਰ ਤੇ ਕਦੇ ਟੈਪ ਨਾ ਕਰੋ (−2 ਸਕਿੰਟ)।',g:'52 ਰਾਜੇ ਆਜ਼ਾਦ ਕਰੋ',u:'ਰਾਜੇ ਆਜ਼ਾਦ',c:['ਬੰਦੀ ਛੋੜ ਦਿਵਸ','“ਬੰਦੀ ਛੋੜ” ਦਾ ਅਰਥ ਹੈ “ਕੈਦੀਆਂ ਦੀ ਰਿਹਾਈ”। ਹਰ ਦੀਵਾਲੀ ਤੇ ਅੰਮ੍ਰਿਤਸਰ ਦਾ ਹਰਿਮੰਦਰ ਸਾਹਿਬ ਦੀਵਿਆਂ ਅਤੇ ਆਤਿਸ਼ਬਾਜ਼ੀ ਨਾਲ ਚਮਕਦਾ ਹੈ।']}}},
{id:'kolkata',name:'Kolkata',where:'West Bengal, India',icon:'drum',color:'#c92a2a',deco:'hibiscus',ll:['bn'],

 story:[[['demon','blood'],'The demon Raktabija had a terrible power: every drop of his blood that hit the ground became a new demon.'],
  [['sword','sparkle'],'Goddess Kali, fierce and fearless, caught every drop before it could fall. The demon army was finished.'],
  [['moon','drum'],'So in Bengal, Assam and Odisha, Diwali night is Kali Puja: midnight worship to the thunder of dhak drums.'],

 tr:{bn:{n:'কলকাতা',w:'পশ্চিমবঙ্গ, ভারত',s:['অসুর রক্তবীজের ছিল এক ভয়ংকর শক্তি: তার রক্তের প্রতিটি ফোঁটা মাটিতে পড়লেই জন্ম নিত এক নতুন অসুর।','নির্ভীক, উগ্র দেবী কালী প্রতিটি ফোঁটা মাটিতে পড়ার আগেই ধরে ফেললেন। অসুরবাহিনী শেষ।','তাই বাংলা, অসম আর ওড়িশায় দীপাবলির রাত হলো কালীপুজো: ঢাকের গর্জনে মাঝরাতের আরাধনা।','তার আগের রাত ভূত চতুর্দশী। ঘরে ঘরে জ্বালানো হয় চোদ্দো প্রদীপ, অশুভ শক্তি দূরে রাখতে আর চোদ্দো পুরুষকে স্মরণ করতে।'],m:'ঢাক বাজাও! সাদা বৃত্তটি ঢাক ছোঁয়ার ঠিক মুহূর্তে যেকোনো জায়গায় ট্যাপ করো।',g:'তালে তালে বাজাও',c:['চোদ্দো প্রদীপ','ভূত চতুর্দশীতে বাঙালি বাড়িতে জ্বলে চোদ্দো প্রদীপ, আর খাওয়া হয় চোদ্দো রকম শাক মিশিয়ে রান্না চোদ্দো শাক।']}}},
{id:'goa',name:'Goa & Tamil Nadu',where:'West & South India',icon:'demon',color:'#0b7285',deco:'palm',ll:['ta'],

 story:[[['demon','chain'],'Narakasura, a mighty demon king, terrorised heaven and earth and imprisoned 16,000 women.'],
  [['shield'],'He had a boon: no one could kill him, except his own mother, Bhudevi, the Earth goddess.'],
  [['bow','crown'],'Krishna rode into battle with his queen Satyabhama, who was Bhudevi reborn. In many tellings, her arrow ended Naraka’s reign.'],
  [['sunrise'],'He fell just before dawn. His last wish: “Let people celebrate my end with lights.”'],
  [['pot','fire'],'So Tamil Nadu begins Deepavali with an oil bath before sunrise, and Goa burns giant Narakasura effigies at dawn.']],
 mission:'Swipe to slash Narakasura’s shadows. Do NOT cut the diyas!',goalText:'Slash 30 shadows',
 game:{type:'slash',goal:30,time:35},
 card:['pot','“Ganga snanam aachaa?”','On Deepavali morning in Tamil Nadu, people greet each other: “Had your Ganga bath?” The pre-dawn oil bath is said to be as holy as a dip in the Ganga.'],
 tr:{ta:{n:'கோவா & தமிழ்நாடு',w:'மேற்கு & தென் இந்தியா',s:['வலிமைமிக்க அசுர மன்னன் நரகாசுரன் விண்ணையும் மண்ணையும் அச்சுறுத்தி, 16,000 பெண்களைச் சிறைப்படுத்தினான்.','அவனுக்கு ஒரு வரம் இருந்தது: அவன் தாய், பூமித்தாய் பூதேவியைத் தவிர வேறு யாரும் அவனைக் கொல்ல முடியாது.','பூதேவியின் மறுபிறவியான தன் அரசி சத்யபாமாவுடன் கிருஷ்ணர் போருக்குச் சென்றார். பல கதைகளில், அவளுடைய அம்பே நரகனின் ஆட்சியை முடித்தது.','விடியலுக்குச் சற்று முன் அவன் வீழ்ந்தான். அவனுடைய கடைசி ஆசை: “என் முடிவை மக்கள் விளக்குகளுடன் கொண்டாடட்டும்.”','அதனால்தான் தமிழ்நாட்டில் தீபாவளி சூரிய உதயத்துக்கு முன் எண்ணெய்க் குளியலுடன் தொடங்குகிறது, கோவாவில் விடியலில் பெரிய நரகாசுரன் உருவங்கள் எரிக்கப்படுகின்றன.'],m:'நரகாசுரனின் நிழல்களை ஸ்வைப் செய்து வெட்டு. விளக்குகளை வெட்டாதே!',g:'30 நிழல்களை வெட்டு',c:['“கங்கா ஸ்நானம் ஆச்சா?”','தமிழ்நாட்டில் தீபாவளி காலையில் மக்கள் ஒருவரையொருவர் “கங்கா ஸ்நானம் ஆச்சா?” என்று வாழ்த்துகிறார்கள். விடியற்காலை எண்ணெய்க் குளியல் கங்கையில் நீராடுவதைப் போலப் புனிதமானது என்பர்.']}}},
{id:'gujarat',name:'Gujarat',where:'Gujarat, India',icon:'book2',color:'#c2255c',deco:'palette',ll:['gu'],

 tr:{gu:{n:'ગુજરાત',w:'ગુજરાત, ભારત',s:['ગુજરાતમાં દિવાળી વર્ષનો છેલ્લો દિવસ છે. વેપારીઓ તેમના જૂના ચોપડા બંધ કરે છે.','ચોપડા પૂજનમાં નવા ચોપડાનું પૂજન થાય છે અને તેના પર “શુભ લાભ” લખાય છે.','બીજી સવારે બેસતું વર્ષ, ગુજરાતી નવું વર્ષ. સૌ એકબીજાને કહે છે: “સાલ મુબારક!”','ઉંબરે રંગોળી ખીલી ઊઠે છે: લક્ષ્મીજી અને નવા વર્ષને આવકારવા રંગીન ભૂકીની ભાત.'],m:'રંગોળી પૂરી કરો! ડાબી બાજુ જેવી ભાત બનાવવા જમણી બાજુના ખાના પર ટેપ કરો. રંગ બદલવા ફરી ટેપ કરો.',g:'2 રંગોળી પૂરી કરો',c:['સાલ મુબારક!','બેસતું વર્ષ, ગુજરાતી નવું વર્ષ, દિવાળીના બીજા દિવસે આવે છે. પરિવારો વડીલોને મળવા જાય છે, નવાં કપડાં પહેરે છે અને મીઠાઈ વહેંચે છે.']}}},

 tr:{ne:{n:'नेपाल',w:'नेपाल',s:['नेपालमा दीपावलीलाई तिहार भनिन्छ: हाम्रो जीवनमा साथ दिने प्राणीहरूलाई सम्मान गर्ने पाँच दिन।','पहिलो दिन, काग तिहार: सन्देशवाहक कागलाई सबैभन्दा पहिले खुवाइन्छ।','दोस्रो दिन, कुकुर तिहार: हरेक कुकुरले सयपत्रीको माला, रातो टीका र मीठो भोज पाउँछ। असल कुकुर!','तेस्रो दिन गाई र लक्ष्मी देवीको पूजा हुन्छ। चौथो दिन गोरुको पूजा हुन्छ, र नेवार परिवारहरू आफ्नै आत्माको सम्मान गर्दै म्ह पूजा गर्छन्।','पाँचौं दिन, भाइटीका: दिदीबहिनीहरूले दाजुभाइलाई सप्तरङ्गी टीका र लामो समयसम्म नओइलाउने मखमली फूलको माला लगाइदिन्छन्।'],m:'दिनैपिच्छे! तिहारको हरेक दिन कसलाई सम्मान गरिन्छ, छिटो थिच्नुहोस्।',g:'7 छिटा प्रश्न',c:['कुकुर तिहार','तिहारको दोस्रो दिन नेपालले कुकुरलाई वफादार रक्षकको रूपमा सम्मान गर्छ, सयपत्रीको माला, रातो टीका र मीठो खानासहित।'],

{id:'kalapani',name:'Kala Pani',where:'Across the Indian Ocean',icon:'ship',color:'#1098ad',deco:'wave',chap:'ch3',ll:['hi'],

 tr:{hi:{n:'काला पानी',w:'हिंद महासागर के पार',s:['1834 में पूरे ब्रिटिश साम्राज्य में गुलामी खत्म हुई। पर दूर-दराज़ के बागानों को अब भी मज़दूर चाहिए थे।','1834 से 1917 के बीच दस लाख से ज़्यादा भारतीय गिरमिटिया मज़दूर बनकर “काला पानी” पार कर गए।','उनके पास बहुत कम सामान था: कुछ कपड़े, रामायण, और घर की यादें।','मॉरीशस, फ़िजी, त्रिनिदाद, गयाना, दक्षिण अफ़्रीका और उससे आगे, उन्होंने फिर से दीये जलाए। दिवाली उनके साथ समंदर पार पहुँची।'],m:'जहाज़ चलाएँ! तूफ़ानों और भँवरों से बचने के लिए बाएँ-दाएँ स्वाइप या टैप करें। दीये इकट्ठा करें।',g:'किनारे तक पहुँचें',c:['आप्रवासी घाट','मॉरीशस के पोर्ट लुई में आप्रवासी घाट, जहाँ गिरमिटिया मज़दूर उतरे थे, यूनेस्को विश्व धरोहर स्थल है। मॉरीशस में दिवाली पर सार्वजनिक छुट्टी होती है।']}}},

  ta:{n:'மலேசியா & சிங்கப்பூர்',w:'தென்கிழக்கு ஆசியா',s:['1800களில், தமிழ்த் தொழிலாளர்களும் வணிகர்களும் தீபாவளியை மலாயாவுக்கும் சிங்கப்பூருக்கும் கொண்டுவந்தனர்.','ஒவ்வொரு ஆண்டும், சிங்கப்பூரின் லிட்டில் இந்தியா பகுதி சிராங்கூன் சாலையை வாரக்கணக்கில் ஜொலிக்கும் தோரணங்களால் ஒளிரச் செய்கிறது.','மலேசியாவில் குடும்பங்கள் “திறந்த இல்லம்” நடத்துகின்றன. எல்லாப் பண்பாடுகளையும் மதங்களையும் சேர்ந்த அண்டை வீட்டார் வந்து உண்டு கொண்டாடுகிறார்கள்.','வாசலில் அரிசி மாவால் வரையப்பட்ட கோலம், எறும்புகளும் பறவைகளும் கூட விருந்தில் பங்கு பெறுவதற்காக.'],m:'திறந்த இல்லம்! அட்டைகளைத் திருப்பி ஒவ்வொரு சொல்லையும் அதன் பொருளுடன் பொருத்து.',g:'6 ஜோடிகளைப் பொருத்து',c:['கோலம்','எறும்புகளும் பறவைகளும் உண்ணும்படி அரிசி மாவால் கோலம் வரையப்படுகிறது: பிற உயிர்களுக்கு உணவளிக்கும் தினசரிச் செயல், தீபாவளியில் இன்னும் அழகாக.'],x:[['தீபாவளி','விளக்குகளின் வரிசை'],['கோலம்','அரிசி மாவுக் கலை'],['திறந்த இல்லம்','அனைவரும் வரவேற்கப்படுவர்'],['சிராங்கூன் சாலை','லிட்டில் இந்தியா ஒளி'],['முறுக்கு','மொறுமொறு சுருள் பலகாரம்'],['வணக்கம்','தமிழ் வாழ்த்து']]}}},
{id:'leicester',name:'Leicester',where:'England, UK',icon:'bulb',color:'#4263eb',deco:'sparkle',chap:'ch4',ll:['gu'],

 story:[[['plane','house'],'From the 1960s, families from India and East Africa built new homes in Leicester, England.'],

 card:['bulb','The Golden Mile','Leicester’s Belgrave Road hosts a Diwali lights switch-on and festival that draws huge crowds, among the largest outside India.'],
 tr:{gu:{n:'લેસ્ટર',w:'ઇંગ્લેન્ડ, યુકે',s:['1960ના દાયકાથી ભારત અને પૂર્વ આફ્રિકાના પરિવારોએ ઇંગ્લેન્ડના લેસ્ટરમાં નવાં ઘર વસાવ્યાં.','1972માં યુગાન્ડામાંથી એશિયનોને હાંકી કાઢવામાં આવ્યા. હજારો લોકો લેસ્ટર આવ્યા અને ફરીથી જીવન શરૂ કર્યું.','બેલગ્રેવ રોડ સાડી અને ઘરેણાંની દુકાનોથી ભરાઈ ગયો. લોકોએ તેને “ગોલ્ડન માઇલ” નામ આપ્યું.','આજે ગોલ્ડન માઇલ પર હજારો લાઇટ ઝળહળી ઊઠે છે: ભારત બહારની સૌથી મોટી દિવાળી ઉજવણીઓમાંની એક.'],m:'લાઇટ ચાલુ કરવાની રાત! દરેક ટેપ એક લાઇટ અને તેના પડોશીઓને બદલે છે. બધી 16 ચાલુ કરો.',g:'બધી 16 ચાલુ કરો',c:['ગોલ્ડન માઇલ','લેસ્ટરના બેલગ્રેવ રોડ પર દિવાળીની લાઇટ ચાલુ કરવાનો ઉત્સવ થાય છે, જે ભારત બહારના સૌથી મોટા ઉત્સવોમાંનો એક છે અને ભારે ભીડ ખેંચે છે.']}}},

 card:['globe','One Light','Rama, Krishna, Kali, Mahavira, Guru Hargobind, merchants, dogs, sailors and cities: many stories, one act. A lamp against the dark.'],
 tr:{

 pa:{n:'ਸਭ ਤੋਂ ਹਨੇਰੀ ਰਾਤ',w:'ਹਰ ਥਾਂ',s:['ਮੱਸਿਆ। ਸਭ ਤੋਂ ਹਨੇਰੀ ਰਾਤ। ਦੁਨੀਆ ਭਰ ਵਿੱਚ ਦੀਵੇ ਟਿਮਟਿਮਾਉਣ ਲੱਗੇ ਹਨ…','ਸਿਰਫ਼ ਉਹੀ ਉਨ੍ਹਾਂ ਨੂੰ ਜਗਦਾ ਰੱਖ ਸਕਦੇ ਹਨ ਜਿਨ੍ਹਾਂ ਨੂੰ ਕਹਾਣੀਆਂ ਯਾਦ ਹਨ।','ਬਿਜਲੀ ਗੇੜ! ਹਰ ਸਹੀ ਜਵਾਬ ਦੁਨੀਆ ਦਾ ਇੱਕ ਹਿੱਸਾ ਮੁੜ ਰੌਸ਼ਨ ਕਰਦਾ ਹੈ।'],m:'ਤੁਹਾਡੀ ਪੂਰੀ ਯਾਤਰਾ ਵਿੱਚੋਂ 10 ਸਵਾਲ। ਛੇਤੀ ਜਵਾਬ ਦਿਓ, ਵਾਧੂ ਅੰਕ ਪਾਓ!',g:'ਦੁਨੀਆ ਮੁੜ ਰੌਸ਼ਨ ਕਰੋ',c:['ਇੱਕ ਰੌਸ਼ਨੀ','ਰਾਮ, ਕ੍ਰਿਸ਼ਨ, ਕਾਲੀ, ਮਹਾਵੀਰ, ਗੁਰੂ ਹਰਿਗੋਬਿੰਦ ਸਾਹਿਬ, ਵਪਾਰੀ, ਕੁੱਤੇ, ਮਲਾਹ ਅਤੇ ਸ਼ਹਿਰ: ਕਹਾਣੀਆਂ ਅਨੇਕ, ਕਰਮ ਇੱਕ। ਹਨੇਰੇ ਦੇ ਵਿਰੁੱਧ ਇੱਕ ਦੀਵਾ।']},
 bn:{n:'সবচেয়ে অন্ধকার রাত',w:'সর্বত্র',s:['অমাবস্যা। সবচেয়ে অন্ধকার রাত। সারা পৃথিবীতে প্রদীপগুলো কাঁপতে শুরু করেছে…','যারা গল্পগুলো মনে রাখে, শুধু তারাই সেগুলো জ্বালিয়ে রাখতে পারে।','বিদ্যুৎ রাউন্ড! প্রতিটি সঠিক উত্তর পৃথিবীর এক অংশ আবার আলোকিত করে।'],m:'তোমার পুরো যাত্রা থেকে 10টি প্রশ্ন। তাড়াতাড়ি উত্তর দাও, বোনাস পয়েন্ট পাও!',g:'পৃথিবী আবার আলোকিত করো',c:['এক আলো','রাম, কৃষ্ণ, কালী, মহাবীর, গুরু হরগোবিন্দ, বণিক, কুকুর, নাবিক আর শহর: গল্প অনেক, কাজ এক। অন্ধকারের বিরুদ্ধে একটি প্রদীপ।']},
 ta:{n:'இருண்ட இரவு',w:'எல்லா இடங்களிலும்',s:['அமாவாசை. மிக இருண்ட இரவு. உலகம் முழுவதும் விளக்குகள் மினுங்கத் தொடங்குகின்றன…','கதைகளை நினைவில் வைத்திருப்பவர்களால் மட்டுமே அவற்றை எரிய வைக்க முடியும்.','மின்னல் சுற்று! ஒவ்வொரு சரியான பதிலும் உலகின் ஒரு பகுதியை மீண்டும் ஒளிரச் செய்யும்.'],m:'உன் முழுப் பயணத்திலிருந்து 10 கேள்விகள். வேகமாகப் பதில் சொல், கூடுதல் புள்ளிகள் பெறு!',g:'உலகை மீண்டும் ஒளிரச் செய்',c:['ஒரே ஒளி','ராமர், கிருஷ்ணர், காளி, மகாவீரர், குரு ஹர்கோபிந்த், வணிகர்கள், நாய்கள், மாலுமிகள், நகரங்கள்: கதைகள் பல, செயல் ஒன்று. இருளுக்கு எதிராக ஒரு விளக்கு.']},
 gu:{n:'સૌથી અંધારી રાત',w:'દરેક જગ્યાએ',s:['અમાસ. સૌથી અંધારી રાત. દુનિયાભરમાં દીવા ટમટમવા લાગ્યા છે…','જેમને વાર્તાઓ યાદ છે, ફક્ત તેઓ જ તેમને પ્રગટેલા રાખી શકે.','વીજળી રાઉન્ડ! દરેક સાચો જવાબ દુનિયાનો એક ભાગ ફરી પ્રકાશિત કરે છે.'],m:'તમારી આખી યાત્રામાંથી 10 પ્રશ્નો. ઝડપથી જવાબ આપો, બોનસ પોઇન્ટ મેળવો!',g:'દુનિયા ફરી પ્રકાશિત કરો',c:['એક પ્રકાશ','રામ, કૃષ્ણ, કાલી, મહાવીર, ગુરુ હરગોબિંદ, વેપારીઓ, કૂતરા, ખલાસીઓ અને શહેરો: વાર્તાઓ અનેક, કર્મ એક. અંધકાર સામે એક દીવો.']},
 ne:{n:'सबैभन्दा अँध्यारो रात',w:'जताततै',s:['औंसी। सबैभन्दा अँध्यारो रात। संसारभरि दियोहरू झिलमिलाउन थालेका छन्…','कथाहरू सम्झनेहरूले मात्र तिनलाई बलिरहन दिन सक्छन्।','बिजुली चरण! हरेक सही उत्तरले संसारको एउटा भाग फेरि उज्यालो पार्छ।'],m:'तपाईंको पूरै यात्राबाट 10 प्रश्न। छिटो उत्तर दिनुहोस्, बोनस अङ्क पाउनुहोस्!',g:'संसार फेरि उज्यालो पार्नुहोस्',c:['एउटै उज्यालो','राम, कृष्ण, काली, महावीर, गुरु हरगोविन्द, व्यापारी, कुकुर, नाविक र सहरहरू: कथा अनेक, कर्म एक। अँध्यारोविरुद्ध एउटा दियो।']},
 ms:{n:'Malam Paling Gelap',w:'Di mana-mana',s:['Amavasya. Malam paling gelap. Di seluruh dunia, pelita mula berkelip…','Hanya mereka yang mengingati cerita-cerita ini dapat memastikan pelita terus menyala.','Pusingan kilat! Setiap jawapan betul menerangi semula sebahagian dunia.'],m:'10 soalan daripada seluruh perjalanan anda. Jawab pantas untuk mata bonus!',g:'Terangi semula dunia',c:['Satu Cahaya','Rama, Krishna, Kali, Mahavira, Guru Hargobind, pedagang, anjing, pelaut dan bandar: banyak cerita, satu perbuatan. Sebuah pelita melawan kegelapan.']}}}

/* ===================== SCREENS ===================== */
let screen='',cur={L:null,i:0,p:0,lg:'en'},justUnlocked=-1,mapW=0,albumBack='map',escFn=null,storyGo=()=>{};
const unlocked=i=>i===0||(save.stars[LV[i-1].id]||0)>0;
const totalStars=()=>LV.reduce((a,l)=>a+(save.stars[l.id]||0),0);
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));screen=id}
function modal(x,esc){const m=$('#modal');m.innerHTML=x;m.lang=TL;m.classList.add('on');escFn=esc||null;const b=$('.btn',m);if(b)try{b.focus({preventScroll:true})}catch(e){}return m}
function closeModal(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';escFn=null}
function toast(t){const e=h('div','toast',t);e.setAttribute('role','status');app.appendChild(e);setTimeout(()=>e.remove(),2300)}
const onOff=(k,v)=>`${t(k)}: <b>${t(v?'on':'off')}</b>`;

function goTitle(){G.reset();closeModal();TL=save.lang;show('s-title');const started=Object.keys(save.stars).length>0;
 $('#s-title').innerHTML=`<div class="sky"></div><div class="tc"><div class="hero">${ic('diya')}</div><h1 class="logo">Deepa Quest</h1><p class="tag">${t('tag')}</p>
 <div class="stack"><button class="btn pri" id="tp">${ic('play')}${t(started?'cont':'begin')}</button><button class="btn" id="ta">${ic('book')}${t('album')}</button>
 <button class="btn" id="tl">${ic('globeL')}<span>${t('lang')}: <b lang="${save.lang}">${LN[save.lang]}</b></span></button>
 <div class="row"><button class="btn" id="ts" aria-pressed="${save.snd}">${ic(save.snd?'sndOn':'sndOff')}${t('sound')}</button><button class="btn" id="th" aria-pressed="${save.hap}">${ic(save.hap?'vib':'vibOff')}${t('vib')}</button></div></div>
 <p class="foot">${t('foot')}</p></div>`;
 $('#tp').onclick=()=>{actx();sfx.good();if(!save.seen){save.seen=true;persist();openStory(PRO,-1)}else goMap()};
 $('#ta').onclick=()=>goAlbum('title');
 $('#tl').onclick=()=>{sfx.tap();pickLang(goTitle)};
 $('#ts').onclick=()=>{save.snd=!save.snd;persist();goTitle();sfx.tap()};
 $('#th').onclick=()=>{save.hap=!save.hap;persist();buzz(30);goTitle()};
}
function pickLang(back){const ks=Object.keys(LN);
 modal(`<div class="mcard"><div class="rt">${t('langT')}</div><div class="stack" id="lgs" style="margin-top:16px">${ks.map(l=>`<button class="btn${l===save.lang?' sel':''}" data-l="${l}" lang="${l}">${LN[l]}${l===save.lang?ic('check'):''}</button>`).join('')}<button class="btn ghost" id="lc">${t('close')}</button></div></div>`,closeModal);
 $('#lgs').onclick=e=>{const b=e.target.closest('[data-l]');if(b){save.lang=b.dataset.l;persist();setUI();sfx.tap();closeModal();back()}else if(e.target.closest('#lc'))closeModal()}}

function goMap(){G.reset();closeModal();TL=save.lang;show('s-map');renderMap()}
function renderMap(){
 const S=$('#s-map');TL=save.lang;
 S.innerHTML=`<div class="mhead"><button class="ib" id="mh" aria-label="${t('home')}">${ic('home')}</button><span class="mlogo">${ic('diya')} Deepa Quest</span><span class="chip">${ic('star')}${totalStars()}/${LV.length*3}</span><button class="ib" id="ma" aria-label="${t('album')}">${ic('book')}</button><button class="ib" id="ms" aria-label="${t('settings')}">${ic('sliders')}</button></div><div class="mscroll"><div class="mapw"></div></div>`;
 const sc=$('.mscroll',S),wrap=$('.mapw',S),W=sc.clientWidth||360;mapW=app.clientWidth;
 const xs=[.5,.76,.5,.24],pts=[];let y=70,html='';
 LV.forEach((l,i)=>{if(l.chap){y+=i?40:0;html+=`<div class="chap" style="top:${y}px">${t(l.chap)}</div>`;y+=92}
  const xf=xs[i%4];pts.push({x:Math.round(W*xf),y});
  const dx=xf>.5?.15:xf<.5?.85:(i%8<4?.15:.85);html+=`<span class="deco" style="left:${Math.round(W*dx)}px;top:${y+10}px">${ic(l.deco)}</span>`;
  y+=132});
 const H=y+20,c=LV.findIndex((l,i)=>unlocked(i)&&!(save.stars[l.id]>0)),reach=c<0?LV.length-1:c;
 const path=n=>pts.slice(0,n+1).map((p,i,a)=>{if(!i)return`M${p.x} ${p.y}`;const q=a[i-1],m=(q.y+p.y)/2;return`C${q.x} ${m} ${p.x} ${m} ${p.x} ${p.y}`}).join(' ');
 html=`<svg class="pth" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path class="pb" d="${path(LV.length-1)}"/><path class="pl" d="${path(reach)}"/></svg>`+html;
 LV.forEach((l,i)=>{const p=pts[i],s=save.stars[l.id]||0,lk=!unlocked(i),cls=lk?'lock':s?'done':'cur',nm=nameOf(l),ln=l.ll&&l.ll[0],sub=ln&&l.tr[ln].n!==nm?l.tr[ln].n:'';
  html+=`<button class="node ${cls}${i===justUnlocked?' new':''}" style="left:${p.x}px;top:${p.y}px;--c:${l.color}" data-i="${i}" aria-label="${nm}${lk?' · '+t('locked'):''}">${i===c?`<span class="now">${t('playB')}</span>`:''}<span class="orb">${ic(l.icon)}${lk?`<span class="lk">${ic('lock')}</span>`:''}</span><span class="nm">${nm}${sub?`<small lang="${ln}">${sub}</small>`:''}</span><span class="st">${lk?'':stars(s)}</span></button>`});
 wrap.style.height=H+'px';wrap.innerHTML=html;
 wrap.onclick=e=>{const b=e.target.closest('.node');if(!b)return;const i=+b.dataset.i;
  if(!unlocked(i)){sfx.bad();buzz(60);toast(ic('lock')+t('locked'));return}
  sfx.tap();openStory(LV[i],i)};
 $('#mh').onclick=goTitle;$('#ma').onclick=()=>goAlbum('map');$('#ms').onclick=settings;
 const f=pts[justUnlocked>=0?justUnlocked:reach];sc.scrollTop=Math.max(0,f.y-sc.clientHeight*.5);justUnlocked=-1;
}

function openStory(L,i){G.reset();closeModal();cur={L,i,p:0,lg:lgOf(L)};show('s-story');renderStory()}
const artSize=n=>`min(${Math.min(34,74/n).toFixed(1)}vw,${Math.round(Math.min(150,300/n))}px)`;
function renderStory(){
 const {L,i,p,lg}=cur,S=$('#s-story'),P=L.story,mis=p>=P.length,x=X(L,lg),ops=langsOf(L);TL=lg;S.lang=lg;
 S.style.setProperty('--sbg',L.sbg);
 const nx=ops[(ops.indexOf(lg)+1)%ops.length];
 const bars=P.map((_,k)=>`<i class="${k<=p?'f':''}"></i>`).join('')+(L.pro?'':`<i class="${mis?'f':''}"></i>`);
 const top=`<div class="stop"><span class="place">${ic('pin')}<span>${x.w}</span></span>${ops.length>1?`<button class="pill" id="sl" aria-label="${t('storyIn')}: ${LN[nx]}">${ic('globeL')}<span lang="${nx}">${LN[nx]}</span></button>`:''}${!mis&&!L.pro?`<button class="ib" id="sk" aria-label="${t('skip')}" title="${t('skip')}">${ic('skip')}</button>`:''}<button class="ib" id="sx" aria-label="${t('close')}">${ic('close')}</button></div>`;
 const body=!mis?`<div class="sart"><span class="art" style="--s:${artSize(P[p][0].length)}">${P[p][0].map(n=>ic(n)).join('')}</span></div><div class="stext"><b class="who">${L.pro?t('jyoti'):x.n}</b><p aria-live="polite">${x.s[p]}</p><div class="snav"><button class="sbtn" id="sb"${p?'':' disabled'}>${ic('bwd')}${t('prev')}</button><button class="sbtn go" id="sn">${t(L.pro&&p===P.length-1?'begin2':'next')}${ic('fwd')}</button></div></div>`
  :`<div class="mis"><div class="hero">${ic(L.icon)}</div><div class="mt">${ic('target')}${t('mission')}</div><div class="mx">${x.m}</div><div class="mgoal">${x.g}${save.stars[L.id]?` · ${t('best')} ${stars(save.stars[L.id])}`:''}</div><div class="stack" style="max-width:320px"><button class="btn pri" id="sp">${ic('play')}${t('play')}</button><button class="btn ghost" id="sr">${ic('restart')}${t('reread')}</button></div></div>`;
 S.innerHTML=`<div class="sbars">${bars}</div>${top}${body}`;
 storyGo=d=>{const np=cur.p+d;if(np<0||cur.p>=P.length)return;cur.p=np;sfx.tap();if(L.pro&&cur.p>=P.length){goMap();return}renderStory()};
 $('#sx').onclick=()=>{sfx.tap();goMap()};
 if($('#sl'))$('#sl').onclick=()=>{SL[L.id]=cur.lg=nx;sfx.tap();renderStory()};
 if($('#sk'))$('#sk').onclick=()=>{cur.p=P.length;sfx.tap();renderStory()};
 let sx=null,swiped=false;
 if(!mis){$('#sn').onclick=()=>storyGo(1);$('#sb').onclick=()=>storyGo(-1);
  S.onpointerdown=e=>{sx=e.clientX};
  S.onpointerup=e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>60&&!e.target.closest('button')){swiped=true;storyGo(dx<0?1:-1)}};
  S.onclick=e=>{if(swiped){swiped=false;return}if(e.target.closest('button'))return;const r=S.getBoundingClientRect();storyGo(e.clientX-r.left<r.width*.28?-1:1)}}
 else{S.onclick=S.onpointerdown=S.onpointerup=null;$('#sp').onclick=()=>{sfx.good();startGame(L,i)};$('#sr').onclick=()=>{cur.p=0;renderStory()}}
}

function startGame(L,i){
 const lg=cur.L===L?cur.lg:lgOf(L);TL=lg;
 if(!E[L.game.type]){toast(t('gnf'));return}
 G.reset();closeModal();show('s-game');cur={L,i,p:0,lg};
 gst.innerHTML='';gst.className='';gst.lang=lg;gst.style.background=L.gbg;const x=X(L,lg);
 HUD.name(`${x.n} · ${x.g}`);HUD.time(1);HUD.score('');HUD.lives(null);
 if(L.gdeco)gst.appendChild(h('div','gdeco',L.gdeco.map(n=>ic(n)).join('')));
 const rd=h('div','ready',t('ready'));gst.appendChild(rd);
 G.later(()=>{rd.textContent=t('go');sfx.good();buzz(20)},650);
 let fired=false;
 G.later(()=>{rd.remove();E[L.game.type](gst,gcfg(L,lg),res=>{if(fired)return;fired=true;G.reset();showResult(L,i,res)})},1150);
}
function pauseMenu(){if(screen!=='s-game'||$('#modal').classList.contains('on'))return;G.pause();
 const res=()=>{closeModal();G.resume()};
 const draw=()=>{modal(`<div class="mcard"><div class="rt">${t('paused')}</div><p class="rf">${t('pausedTx')}</p><div class="stack"><button class="btn pri" id="pr">${ic('play')}${t('resume')}</button><div class="row"><button class="btn" id="pq">${ic('restart')}${t('restart')}</button><button class="btn" id="pm">${ic('map')}${t('map')}</button></div><button class="btn ghost" id="ps">${ic(save.snd?'sndOn':'sndOff')}${onOff('sound',save.snd)}</button></div></div>`,res);
  $('#pr').onclick=res;$('#pq').onclick=()=>startGame(cur.L,cur.i);$('#pm').onclick=goMap;$('#ps').onclick=()=>{save.snd=!save.snd;persist();draw();sfx.tap()}};

/* ===================== MINI-GAMES: E[type](stage,cfg,done) → done({stars:0-3,line}) ===================== */
function field(st,cls){const r=h('div',cls||'field');st.appendChild(r);return r}
function rel(el){const r=el.getBoundingClientRect(),s=gst.getBoundingClientRect();return[r.left-s.left+r.width/2,r.top-s.top+r.height/2]}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function keys(fn){const k=e=>{if(!G.paused&&!$('#modal').classList.contains('on'))fn(e)};addEventListener('keydown',k);G.cleanup=()=>removeEventListener('keydown',k)}

/* 1 · TAP: light diyas / free kings */
E.tap=(st,c,done)=>{
 const F=field(st),T=c.time*1000,t0=G.now(),live=[],gi=ic(c.good),bi=c.bad?ic(c.bad):'';
 let hits=0,miss=0,combo=0,pen=0,iv=c.spawn,next=0,over=false,W=F.clientWidth,H=F.clientHeight;
 G.onResize=()=>{W=F.clientWidth;H=F.clientHeight};
 const sc=()=>HUD.score(`${gi}${hits}/${c.goal}`);sc();
 const kill=(o,cls,ms)=>{o.dead=1;live.splice(live.indexOf(o),1);o.e.classList.add(cls);setTimeout(()=>o.e.remove(),ms||260)};
 const end=win=>{if(over)return;over=true;const acc=Math.round(hits*100/Math.max(1,hits+miss));
  G.later(()=>done({stars:win?(acc>=90?3:acc>=75?2:1):0,line:t('acc',{h:hits,g:c.goal,u:c.unit,a:acc})}),500)};
 function spawn(now){let x,y,k=0;
  do{x=rnd(42,W-42);y=rnd(42,H-70);k++}while(k<12&&live.some(o=>Math.hypot(o.x-x,o.y-y)<80));
  const bad=!!c.bad&&Math.random()<c.badRate,e=h('button','tgt'+(c.dim&&!bad?' dim':''),bad?bi:gi);e.tabIndex=-1;
  e.style.left=x+'px';e.style.top=y+'px';F.appendChild(e);const o={x,y,e,bad,t:now};e._o=o;live.push(o)}
 F.addEventListener('pointerdown',ev=>{const b=ev.target.closest('.tgt'),o=b&&b._o;if(over||G.paused||!o||o.dead)return;
  const gx=o.x,gy=o.y+F.offsetTop;
  if(o.bad){kill(o,'boom');pen+=2000;miss++;combo=0;sfx.bad();buzz(90);flash();shakeEl(F);pop('−2s',gx,gy,'bad');return}
  kill(o,'lit',450);hits++;combo++;sfx.good();buzz(12);burstAt(gx,gy,12);
  if(combo%5===0)pop(t('combo',{n:combo}),gx,gy-34,'good big');else pop('+1',gx,gy);
  sc();if(hits>=c.goal)end(true)});
 G.loop(now=>{if(over)return;const el=now-t0+pen;HUD.time(1-el/T);if(el>=T)return end(false);
  if(now>=next){if(live.length<7)spawn(now);iv=Math.max(c.min,iv-c.accel);next=now+iv}
  for(let i=live.length-1;i>=0;i--){const o=live[i];if(now-o.t>c.life){if(!o.bad){miss++;combo=0}kill(o,'out')}}});
};

/* 2 · SHIELD: hold Govardhan over the village */
E.shield=(st,c,done)=>{
 const F=field(st),K=makeCanvas(F),x=K.ctx,T=c.time*1000,t0=G.now(),drops=[],spl=[];
 let hill=K.W/2,cx=K.W/2,goal=K.W/2,hp=100,blocked=0,next=t0+500,bolt=t0+3500,day=1,last=t0,over=false;
 const hearts=()=>HUD.lives(Math.max(0,Math.ceil(hp/34)));hearts();
 const sc=()=>HUD.score(`${ic('drop')}${t('dayN',{d:day})}`);sc();
 const mv=e=>{const r=K.c.getBoundingClientRect();hill=clamp(e.clientX-r.left,48,K.W-48)};
 K.c.addEventListener('pointerdown',e=>{try{K.c.setPointerCapture(e.pointerId)}catch(_){}mv(e)});
 K.c.addEventListener('pointermove',mv);
 keys(e=>{if(e.key==='ArrowLeft')hill=clamp(hill-40,48,K.W-48);if(e.key==='ArrowRight')hill=clamp(hill+40,48,K.W-48)});
 const fin=(s,line)=>{over=true;G.later(()=>done({stars:s,line}),600)};
 G.loop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const W=K.W,H=K.H,el=now-t0,p=clamp(el/T,0,1),hy=H-170,vy=H-34;
  if(!over){HUD.time(1-p);
   const d=Math.min(7,1+Math.floor(p*7));if(d!==day){day=d;sc();pop(t('dayS',{d}),W/2,F.offsetTop+H*.4,'good big')}
   if(el>=T){sfx.win();fin(hp>=80?3:hp>=50?2:1,t('shelter',{b:blocked}))}
   if(Math.abs(goal-cx)<8)goal=rnd(50,W-50);
   cx+=Math.sign(goal-cx)*Math.min(Math.abs(goal-cx),(90+p*170)*dt);
   if(now>=next){drops.push({x:cx+rnd(-34,34),y:70,v:rnd(240,300)*(1+p*.8),b:0});next=now+Math.max(110,300-p*190)}
   if(now>=bolt){drops.push({x:cx,y:76,v:520+p*180,b:1});bolt=now+rnd(2600,4200);sfx.thunder()}}
  for(let i=drops.length-1;i>=0;i--){const o=drops[i];o.y+=o.v*dt;if(over)continue;
   if(o.y>=hy-30&&o.y<=hy+12&&Math.abs(o.x-hill)<58){drops.splice(i,1);blocked+=o.b?3:1;spl.push({x:o.x,y:hy-30,t:now});if(o.b){sfx.good();burstAt(o.x,hy-30+F.offsetTop,10,['#fff','#ffe066'])}continue}
   if(o.y>=vy-24){drops.splice(i,1);hp-=o.b?12:4;hearts();sfx.bad();buzz(o.b?140:40);flash(o.b?'#ffffff':'#4d8dff');if(o.b)shakeEl(F);
    if(hp<=0)fin(0,t('flood',{d:day}))}}
  x.clearRect(0,0,W,H);
  spr(x,'cloud',84,cx,42);
  x.strokeStyle='rgba(160,210,255,.85)';x.lineWidth=2.5;x.lineCap='round';x.beginPath();
  for(const o of drops)if(!o.b){x.moveTo(o.x,o.y-12);x.lineTo(o.x,o.y)}x.stroke();
  for(const o of drops)if(o.b)spr(x,'bolt',42,o.x,o.y);
  for(let i=spl.length-1;i>=0;i--){const s=spl[i],k=(now-s.t)/300;if(k>=1){spl.splice(i,1);continue}x.strokeStyle=`rgba(200,230,255,${(1-k).toFixed(2)})`;x.lineWidth=2;x.beginPath();x.arc(s.x,s.y,6+k*16,Math.PI,0);x.stroke()}
  const n=Math.max(4,Math.round(W/70));for(let i=0;i<n;i++)spr(x,i%2?'cow':'house',34,W*(i+.5)/n,vy);
  x.strokeStyle='#ffd8a8';x.lineWidth=3;x.beginPath();x.moveTo(hill,hy+40);x.lineTo(hill,hy+52);x.stroke();
  spr(x,'child',38,hill,hy+70);spr(x,'hill',116,hill,hy)});
};

/* 3 · SWIPE: true / false wisdom cards */
E.swipe=(st,c,done)=>{
 const R=field(st,'sw'),cards=shuffle(c.cards),n=cards.length;
 R.innerHTML=`<div class="deck"></div><div class="swb"><button class="no" aria-label="${t('F')}">${ic('close')}</button><button class="yes" aria-label="${t('T')}">${ic('check')}</button></div><div class="why">${t('swH')}</div>`;
 const deck=$('.deck',R),why=$('.why',R);let i=0,ok=0,busy=true,top=null;

 const make=k=>h('div','sc',`<span class="lbl t">${t('T')}</span><span class="lbl f">${t('F')}</span><div class="se">${ic(cards[k][0])}</div><div class="sq">${cards[k][1]}</div><div class="sn">${k+1} / ${n}</div>`);
 function deal(){deck.innerHTML='';if(i+1<n){const b=make(i+1);b.classList.add('back');deck.appendChild(b)}top=make(i);deck.appendChild(top);drag(top);busy=false}
 function drag(el){let sx=0,dx=0,on=false;const lt=$('.t',el),lf=$('.f',el);
  el.addEventListener('pointerdown',e=>{if(busy)return;on=true;sx=e.clientX;dx=0;el.style.transition='none';try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;el.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;lt.style.opacity=clamp(dx/90,0,1);lf.style.opacity=clamp(-dx/90,0,1)});
  const up=()=>{if(!on)return;on=false;if(Math.abs(dx)>90)decide(dx>0);else{el.style.transition='transform .25s';el.style.transform='';lt.style.opacity=lf.style.opacity=0}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
 function decide(yes){if(busy||G.paused)return;busy=true;const cd=cards[i],right=yes===!!cd[2],el=top;
  $(yes?'.t':'.f',el).style.opacity=1;el.style.transition='transform .35s ease-in,opacity .35s';
  el.style.transform=`translateX(${(yes?1:-1)*(R.clientWidth+160)}px) rotate(${yes?28:-28}deg)`;el.style.opacity=0;
  if(right){ok++;sfx.good();buzz(12)}else{sfx.bad();buzz(70)}
  why.className='why '+(right?'good':'bad');why.innerHTML=`${ic(right?'check':'close')} <b>${t(right?'right':'wrong')}</b> ${cd[3]}`;if(!right)shakeEl(why);
  sc();i++;
  if(i<n)G.later(deal,380);else G.later(()=>done({stars:ok>=n?3:ok>=n-2?2:ok>=Math.ceil(n*.6)?1:0,line:t('judged',{o:ok,n})}),1600)}
 $('.yes',R).onclick=()=>decide(true);$('.no',R).onclick=()=>decide(false);
 keys(e=>{if(e.key==='ArrowRight')decide(true);if(e.key==='ArrowLeft')decide(false)});
 deal();
};

/* 4 · RHYTHM: play the dhak, light 14 lamps */
E.rhythm=(st,c,done)=>{
 const R=field(st,'rh');
 R.innerHTML=`<div class="l14">${ic('diya').repeat(14)}</div><div class="rw"><div class="rtg">${ic('drum')}</div></div><div class="rj"></div><div class="rsub">${t('rhS')}</div>`;
 const rw=$('.rw',R),tg=$('.rtg',R),rj=$('.rj',R),lamps=$$('.l14 .i',R),beat=600,A=1150,s0=G.now(),notes=[];
 let tt=s0+1500,hits=0,slips=0,perf=0,combo=0,over=false;
 [1,1,1,.5,.5,1,1,1,1,.5,.5,1,.5,.5,1,1,.5,.5].forEach(d=>{notes.push({t:tt,j:0,el:null});tt+=d*beat});
 const endT=tt+300,lit=()=>clamp(hits-slips,0,14);
 const paint=()=>{const n=lit();lamps.forEach((s,k)=>s.classList.toggle('on',k<n));HUD.score(`${ic('diya')}${n}/14`)};
 const say=(txt,col)=>{rj.textContent=txt;rj.style.color=col;rj.classList.remove('hit');void rj.offsetWidth;rj.classList.add('hit')};
 function tap(){if(over||G.paused)return;const now=G.now();let b=null,bd=1e9;
  for(const n of notes)if(!n.j){const d=Math.abs(now-n.t);if(d<bd){bd=d;b=n}}
  tg.classList.remove('hit');void tg.offsetWidth;tg.classList.add('hit');sfx.drum();buzz(15);
  if(b&&bd<=150){b.j=1;if(b.el){b.el.remove();b.el=null}hits++;combo++;
   if(bd<=65){perf++;say(combo>=4?`${t('perfect')} ×${combo}`:t('perfect'),'#ffe066')}else say(t('good'),'#7dffb8');
   const [px,py]=rel(tg);burstAt(px,py,10,['#ff3b3b','#ffd166','#fff'])}
  else{slips++;combo=0;say(t('offb'),'#ff8a9b');shakeEl(rw)}
  paint()}
 R.addEventListener('pointerdown',tap);
 keys(e=>{if(e.code==='Space'){e.preventDefault();tap()}});
 paint();
 G.loop(now=>{if(over)return;HUD.time(1-clamp((now-s0)/(endT-s0),0,1));
  for(const n of notes){if(n.j)continue;const d=n.t-now;if(d>A)break;
   if(!n.k&&d<=0){n.k=1;sfx.tick()}
   if(!n.el){n.el=h('div','ring');rw.appendChild(n.el)}
   if(d<-150){n.j=2;n.el.remove();n.el=null;combo=0;say(t('miss'),'#ff5d7a');continue}
   const s=d>=0?1+d/A*1.7:1+d/A*.8,o=d>=0?.15+.85*(1-d/A):clamp(1+d/150,0,1);
   n.el.style.transform=`scale(${s.toFixed(3)})`;n.el.style.opacity=o.toFixed(2)}
  if(now>=endT){over=true;const L=lit();G.later(()=>done({stars:L>=14?3:L>=10?2:L>=7?1:0,line:t('rhEnd',{l:L,p:perf})}),500)}});
};

/* 5 · SLASH: cut Narakasura’s shadows, spare the diyas */
E.slash=(st,c,done)=>{
 const F=field(st),K=makeCanvas(F),x=K.ctx,T=c.time*1000,t0=G.now(),g=900;
 let objs=[],trail=[],lives=3,cut=0,over=false,next=t0+500,last=t0,down=false,px=0,py=0;
 HUD.lives(3);const sc=()=>HUD.score(`${ic('demon')}${Math.min(cut,c.goal)}/${c.goal}`);sc();
 const end=win=>{if(over)return;over=true;G.later(()=>done({stars:win?lives:0,line:win?t('slashW',{c:cut,l:lives}):lives<=0?t('slashD'):t('slashL',{c:cut,g:c.goal})}),700)};
 function wave(){const W=K.W,H=K.H,n=Math.random()<.35?ri(2,3):1;
  for(let k=0;k<n;k++){const sx=rnd(W*.15,W*.85),pk=rnd(H*.12,H*.42),vy=-Math.sqrt(2*g*(H+40-pk)),ft=-2*vy/g;
   objs.push({x:sx,y:H+40,vx:(rnd(W*.25,W*.75)-sx)/ft,vy,r:rnd(-3,3),a:0,d:Math.random()<.22,cut:0})}}
 const pos=e=>{const r=K.c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 K.c.addEventListener('pointerdown',e=>{down=true;[px,py]=pos(e);trail=[{x:px,y:py,t:G.now()}];try{K.c.setPointerCapture(e.pointerId)}catch(_){}});
 K.c.addEventListener('pointermove',e=>{if(!down||over||G.paused)return;const[nx,ny]=pos(e);if(Math.hypot(nx-px,ny-py)<4)return;
  const now=G.now();trail.push({x:nx,y:ny,t:now});let sl=0;
  for(const o of objs){if(o.cut||segDist(o.x,o.y,px,py,nx,ny)>34)continue;o.cut=1;o.ct=now;const gy=o.y+F.offsetTop;
   if(o.d){lives--;HUD.lives(lives);sfx.bad();buzz(130);flash('#ffb52e');shakeEl(F);pop(t('notDiya'),o.x,gy,'bad');if(lives<=0)end(false)}
   else{cut++;sl++;sfx.whoosh();buzz(14);burstAt(o.x,gy,14,['#b197fc','#ff5d7a','#ffd166']);sc();if(cut>=c.goal)end(true)}}
  if(sl>1){pop(t('combo',{n:sl}),nx,ny+F.offsetTop-30,'good big');sfx.good()}
  px=nx;py=ny});
 const up=()=>{down=false};K.c.addEventListener('pointerup',up);K.c.addEventListener('pointercancel',up);
 G.loop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const W=K.W,H=K.H;
  if(!over){const el=now-t0;HUD.time(1-el/T);if(el>=T)end(false);else if(now>=next){wave();next=now+Math.max(520,1050-el/T*500)}}
  for(const o of objs){o.vy+=g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=o.r*dt}
  objs=objs.filter(o=>o.y<H+90&&!(o.cut&&now-o.ct>350));
  x.clearRect(0,0,W,H);
  for(const o of objs){if(o.cut){spr(x,o.d?'boom':'puff',54,o.x,o.y,0,1-(now-o.ct)/350);continue}
   if(o.d){x.fillStyle='rgba(255,190,60,.22)';x.beginPath();x.arc(o.x,o.y,34,0,6.283);x.fill()}
   spr(x,o.d?'diya':'demon',o.d?48:56,o.x,o.y,o.d?0:o.a)}
  trail=trail.filter(p=>now-p.t<150);
  if(trail.length>1){x.lineCap=x.lineJoin='round';x.strokeStyle='rgba(255,236,170,.95)';x.shadowColor='#ffb52e';x.shadowBlur=14;x.lineWidth=6;x.beginPath();trail.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();x.shadowBlur=0}});
};

/* 6 · RANGOLI: mirror the pattern */
E.rangoli=(st,c,done)=>{
 const R=field(st,'rg'),T=120000,t0=G.now(),RS=[{n:6,p:['#ff8a1f','#e8355a']},{n:8,p:['#ffcf3a','#e8355a','#22b8a0']}];
 let r=0,tg=[],cells=[],lock=false,over=false;
 const sc=()=>HUD.score(`${ic('palette')}${r+1}/2`);sc();
 function gen(n,k){const q=n/2,v=Array.from({length:n},()=>Array(n).fill(0));
  for(let a=0;a<q;a++)for(let b=a;b<q;b++)v[a][b]=v[b][a]=Math.random()<.7?ri(1,k):0;
  if(!v[q-1][q-1])v[q-1][q-1]=1;
  for(let a=0;a<q;a++)for(let b=0;b<q;b++)v[a][n-1-b]=v[n-1-a][b]=v[n-1-a][n-1-b]=v[a][b];
  return v}
 const paintC=(e,p)=>{e.style.background=e._v?p[e._v-1]:'';e.style.boxShadow=e._v?`0 0 10px ${p[e._v-1]}88`:''};
 function build(){const {n,p}=RS[r];tg=gen(n,p.length);lock=false;
  R.innerHTML=`<div class="rgt">${t('rgT',{r:r+1})}</div><div class="rgrid" style="grid-template-columns:repeat(${n},1fr)"></div><div class="rhint"></div><div class="rpal">${t('rgP')} <i></i>${p.map(cl=>`→<i style="background:${cl}"></i>`).join('')}→<i></i></div>`;
  const gr=$('.rgrid',R);cells=[];
  for(let a=0;a<n;a++)for(let b=0;b<n;b++){const e=h('button','rc'+(b<n/2?' lh':''));e._a=a;e._b=b;e._v=b<n/2?tg[a][b]:0;paintC(e,p);gr.appendChild(e);cells.push(e)}
  gr.addEventListener('pointerdown',ev=>{const e=ev.target.closest('.rc');if(!e||e._b<n/2||lock||over||G.paused)return;
   e._v=(e._v+1)%(p.length+1);paintC(e,p);sfx.bell(e._v);buzz(8);check()});
  check(true)}
 function check(init){const {n}=RS[r];let left=0;for(const e of cells)if(e._b>=n/2&&e._v!==tg[e._a][e._b])left++;
  $('.rhint',R).innerHTML=left?t('rgL',{n:left}):ic('sparkle')+' '+t('rgOk');
  if(left||init)return;
  lock=true;const gr=$('.rgrid',R);gr.classList.add('win');sfx.win();const [gx,gy]=rel(gr);burstAt(gx,gy,30,['#ffcf3a','#e8355a','#22b8a0','#ff8a1f']);
  r++;if(r<RS.length){sc();G.later(build,1200)}
  else{over=true;const used=G.now()-t0,f=1-used/T;G.later(()=>done({stars:f>=.5?3:f>=.25?2:1,line:t('rgW',{s:Math.round(used/1000)})}),1200)}}
 G.loop(now=>{if(over)return;const f=1-(now-t0)/T;HUD.time(f);if(f<=0){over=true;done({stars:0,line:t('rgF',{r})})}});
 build();
};

/* 7 · QUIZ: Tihar days / lightning finale. items: [question, [4 answers, correct first], explanation] */
E.quiz=(st,c,done)=>{
 const R=field(st,'qz'),P=c.per*1000;let items=c.order?c.items.slice():shuffle(c.items);if(c.pick)items=items.slice(0,c.pick);
 const n=items.length;let q=-1,ok=0,pts=0,qs=0,ans=true,over=false;
 R.innerHTML=`<div class="ql">${ic('diya').repeat(n)}</div><div class="qn"></div><div class="qq"></div><div class="qopts"></div><div class="qw" aria-live="polite"></div>`;
 const L=$$('.ql .i',R),qn=$('.qn',R),qq=$('.qq',R),qo=$('.qopts',R),qw=$('.qw',R);
 HUD.score(`${ic('bolt')}0`);
 function next(){if(++q>=n){over=true;const f=ok/n;return done({stars:f>=.85?3:f>=.6?2:f>=.5?1:0,line:t('qEnd',{o:ok,n,p:pts})})}
  const it=items[q];ans=false;qs=G.now();qn.textContent=t('qN',{q:q+1,n});
  qq.textContent=it[0];qq.style.animation='none';void qq.offsetWidth;qq.style.animation='';qw.textContent='';
  qo.innerHTML=shuffle(it[1].map((o,k)=>({o,k}))).map(({o,k})=>`<button class="qo" data-k="${k}">${o}</button>`).join('')}
 function pick(k,btn){if(ans||over)return;ans=true;const it=items[q],right=k===0;
  if(right){const gain=100+Math.round(clamp(1-(G.now()-qs)/P,0,1)*100);ok++;pts+=gain;sfx.good();buzz(12);L[q].classList.add('y');const [bx,by]=rel(btn);pop(`+${gain}`,bx,by);burstAt(bx,by,10)}
  else{sfx.bad();buzz(70);L[q].classList.add('n');if(btn)shakeEl(btn)}
  $$('.qo',qo).forEach(b=>{if(b.dataset.k==='0')b.classList.add('ok');else if(b===btn)b.classList.add('no')});
  qw.innerHTML=`${right?ic('check'):btn?ic('close'):ic('clock')+' '+t('tUp')} ${it[2]}`;HUD.score(`${ic('bolt')}${pts}`);
  G.later(next,right?1300:2200)}
 qo.addEventListener('pointerdown',e=>{const b=e.target.closest('.qo');if(b&&!G.paused)pick(+b.dataset.k,b)});
 qo.addEventListener('keydown',e=>{const b=e.target.closest('.qo');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(+b.dataset.k,b)}});
 G.loop(now=>{if(over||ans)return;const f=1-(now-qs)/P;HUD.time(f);if(f<=0)pick(-1,null)});
 next();
};

/* 8 · RUNNER: sail the kala pani */
E.runner=(st,c,done)=>{
 const F=field(st),K=makeCanvas(F),x=K.ctx,T=c.time*1000,t0=G.now(),objs=[],TH=[.3,.6,.9],MS=['rn1','rn2','rn3'];
 let lane=1,lives=3,inv=0,lamps=0,next=t0+700,last=t0,over=false,won=0,ms=0,dist=0,gx=0,moved=false;
 HUD.lives(3);const sc=()=>HUD.score(`${ic('diya')}${lamps}`);sc();
 const LX=k=>K.W*(.2+.3*k);let sx=LX(1);
 const move=d=>{if(over||G.paused)return;const nl=clamp(lane+d,0,2);if(nl!==lane){lane=nl;sfx.whoosh();buzz(8)}};
 K.c.addEventListener('pointerdown',e=>{gx=e.clientX;moved=false;try{K.c.setPointerCapture(e.pointerId)}catch(_){}});
 K.c.addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType==='mouse')return;const d=e.clientX-gx;if(Math.abs(d)>30){move(Math.sign(d));gx=e.clientX;moved=true}});
 K.c.addEventListener('pointerup',e=>{if(moved)return;const r=K.c.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
 keys(e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
 function row(){const obs=[ri(0,2)];if(Math.random()<.3)obs.push((obs[0]+ri(1,2))%3);
  obs.forEach(l=>objs.push({l,y:-40,t:Math.random()<.5?'storm':'whirl',o:1}));
  const free=[0,1,2].filter(l=>!obs.includes(l));if(Math.random()<.65)objs.push({l:any(free),y:-40,t:'diya',o:0})}
 G.loop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const W=K.W,H=K.H,el=now-t0,p=clamp(el/T,0,1),sp=260+p*220,sy=H-110;
  dist+=sp*dt;
  if(!over){HUD.time(1-p);
   if(ms<3&&p>=TH[ms]){pop(t(MS[ms]),W/2,F.offsetTop+H*.32,'good big');ms++}
   if(el>=T){over=true;won=now;sfx.win();G.later(()=>done({stars:lives,line:t('rnW',{l:lamps})}),1400)}
   else if(now>=next){row();next=now+Math.max(430,820-p*390)}}
  sx+=(LX(lane)-sx)*Math.min(1,dt*14);
  for(const o of objs){o.y+=sp*dt;
   if(over||o.hit||o.l!==lane||Math.abs(o.y-sy)>38)continue;
   if(!o.o){o.hit=1;lamps++;sc();sfx.good();buzz(10);burstAt(LX(o.l),o.y+F.offsetTop,10);continue}
   if(now<inv)continue;
   o.hit=1;lives--;inv=now+1200;HUD.lives(lives);sfx.bad();buzz(150);flash('#3aa0ff');shakeEl(F);
   if(lives<=0){over=true;G.later(()=>done({stars:0,line:t('rnL')}),800)}}
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.y>H+60||(o.hit&&!o.o))objs.splice(i,1)}
  x.clearRect(0,0,W,H);
  x.strokeStyle='rgba(180,230,255,.16)';x.lineWidth=2;
  for(let i=0;i<9;i++){const y=(dist*.6+i*H/9)%H;x.beginPath();for(let xx=0;xx<=W;xx+=24)x.lineTo(xx,y+Math.sin(xx/38+i*1.7)*5);x.stroke()}
  x.setLineDash([14,22]);x.lineDashOffset=-dist;x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.moveTo(W*.35,0);x.lineTo(W*.35,H);x.moveTo(W*.65,0);x.lineTo(W*.65,H);x.stroke();x.setLineDash([]);
  if(won)spr(x,'island',110,W/2,Math.min(H*.3,-60+(now-won)*.4));
  for(const o of objs){const X=LX(o.l);
   if(o.o)spr(x,o.t,o.t==='whirl'?52:58,X,o.y,o.t==='whirl'?now/250:0,o.hit?.45:1);
   else{x.fillStyle='rgba(255,190,60,.22)';x.beginPath();x.arc(X,o.y,26,0,6.283);x.fill();spr(x,'diya',36,X,o.y)}}
  spr(x,'ship',66,sx,sy,0,now<inv&&Math.floor(now/100)%2?.3:1)});
};

/* 9 · SIMON: bamboo deya patterns */
E.simon=(st,c,done)=>{
 const R=field(st,'sm'),P=['#ffd166','#ff6b6b','#4dabf7','#69db7c','#da77f2','#ffa94d'];
 R.innerHTML=`<div class="si" aria-live="polite">${t('smW')}</div><div class="arch">${P.map((cl,i)=>`<button class="pad" data-i="${i}" style="--pc:${cl}" aria-label="${i+1}">${ic('diya')}</button>`).join('')}</div><div class="ss"></div>`;
 const pads=$$('.pad',R),si=$('.si',R),ss=$('.ss',R),seq=[];let pos=0,inp=false,lives=3,round=0,over=false;
 HUD.time(null);HUD.lives(3);HUD.score(`${ic('bamboo')}0/${c.goal}`);
 const glow=(i,ms)=>{pads[i].classList.add('on');sfx.bell(i);G.later(()=>pads[i].classList.remove('on'),ms)};
 function play(){inp=false;pos=0;si.textContent=t('smW');const on=Math.max(300,540-round*35),gap=Math.max(110,200-round*14);
  seq.forEach((v,k)=>G.later(()=>glow(v,on),600+k*(on+gap)));
  G.later(()=>{inp=true;si.textContent=t('smY')},600+seq.length*(on+gap))}
 function nextRound(){round++;while(seq.length<round+2)seq.push(ri(0,5));ss.textContent=t('smP',{r:round,g:c.goal,n:seq.length});play()}
 function press(i,b){if(!inp||over||G.paused)return;glow(i,220);buzz(10);
  if(i===seq[pos]){if(++pos<seq.length)return;inp=false;si.textContent=t('smG');sfx.good();const [bx,by]=rel(b);burstAt(bx,by,14);HUD.score(`${ic('bamboo')}${round}/${c.goal}`);
   if(round>=c.goal){over=true;G.later(()=>done({stars:lives,line:t('smE',{g:c.goal})}),900)}else G.later(nextRound,900);return}
  inp=false;lives--;HUD.lives(lives);sfx.bad();buzz(120);flash();shakeEl($('.arch',R));
  if(lives<=0){over=true;si.textContent=t('smD');G.later(()=>done({stars:0,line:t('smL',{r:round,g:c.goal})}),1000)}
  else{si.textContent=t('smO');G.later(play,1100)}}
 R.addEventListener('pointerdown',e=>{const b=e.target.closest('.pad');if(b)press(+b.dataset.i,b)});
 keys(e=>{const k=+e.key;if(k>=1&&k<=6)press(k-1,pads[k-1])});
 nextRound();
};

/* 10 · MEMORY: open-house word match. pairs: [word, meaning] */
E.memory=(st,c,done)=>{
 const R=field(st,'mm'),T=75000,t0=G.now(),np=c.pairs.length,deck=[];
 c.pairs.forEach((p,k)=>deck.push({k,f:`<b>${p[0]}</b>`},{k,f:`${ic('chat')}<span>${p[1]}</span>`}));
 const D=shuffle(deck);
 R.innerHTML=`<div class="mgr">${D.map((d,i)=>`<button class="mcd f" data-i="${i}"><div class="in"><div class="ba">${ic('diya')}</div><div class="fa">${d.f}</div></div></button>`).join('')}</div><div class="why" aria-live="polite">${t('mmM')}</div>`;
 const why=$('.why',R);let open=[],got=0,moves=0,lock=true,over=false;
 const sc=()=>HUD.score(`${ic('house')}${got}/${np}`);sc();
 G.later(()=>{$$('.mcd',R).forEach(e=>e.classList.remove('f'));lock=false;why.textContent=t('mmH')},2000);
 R.addEventListener('pointerdown',e=>{const b=e.target.closest('.mcd');if(!b||lock||over||G.paused||b.classList.contains('f'))return;
  b.classList.add('f');sfx.tap();open.push(b);if(open.length<2)return;
  moves++;const [a,z]=open,ka=D[+a.dataset.i].k,kz=D[+z.dataset.i].k;open=[];
  if(ka===kz){got++;a.classList.add('m');z.classList.add('m');sfx.good();buzz(15);const p=c.pairs[ka];why.className='why good';why.innerHTML=`${ic('check')} <b>${p[0]}</b> = ${p[1]}`;sc();const [bx,by]=rel(z);burstAt(bx,by,10);
   if(got===np){over=true;sfx.win();G.later(()=>done({stars:moves<=10?3:moves<=15?2:1,line:t('mmE',{n:np,m:moves})}),900)}}
  else{lock=true;sfx.tick();buzz(30);G.later(()=>{a.classList.remove('f');z.classList.remove('f');lock=false},750)}});
 G.loop(now=>{if(over)return;const f=1-(now-t0)/T;HUD.time(f);if(f<=0){over=true;done({stars:0,line:t('mmL',{g:got,n:np})})}});
};

/* 11 · LIGHTS: Golden Mile switch-on puzzle */
E.lights=(st,c,done)=>{
 const R=field(st,'lo');let g=[],need=new Set(),init=null,moves=0,hints=0,over=false;
 R.innerHTML=`<div class="si">${t('lT')}</div><div class="lg">${`<button class="lc">${ic('bulb')}</button>`.repeat(16)}</div><div class="lrow"><button class="btn" data-a="h">${ic('bulb')}${t('hint')}</button><button class="btn" data-a="r">${ic('restart')}${t('restart')}</button></div><div class="ss">${t('lS')}</div>`;
 const cs=$$('.lc',R),si=$('.si',R);HUD.time(null);
 const press=i=>{const r=i>>2,k=i&3;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const y=r+a,z=k+b;if(y>=0&&y<4&&z>=0&&z<4)g[y*4+z]^=1});need.has(i)?need.delete(i):need.add(i)};
 const paint=hi=>{cs.forEach((e,i)=>{e.classList.toggle('on',!!g[i]);e.classList.toggle('hint',i===hi)});HUD.score(`${ic('bulb')}${g.filter(v=>v).length}/16`);si.textContent=moves?t('lM',{m:moves})+(hints?' · '+t('lHn',{h:hints}):''):t('lT')};
 do{g=Array(16).fill(1);need=new Set();for(let k=0;k<6;k++)press(ri(0,15))}while(need.size<3||g.every(v=>v));
 init={g:g.slice(),n:[...need]};paint(-1);
 R.addEventListener('pointerdown',e=>{if(over||G.paused)return;const b=e.target.closest('.lc,[data-a]');if(!b)return;
  if(b.dataset.a==='h'){hints++;sfx.tick();paint([...need][0]);return}
  if(b.dataset.a==='r'){g=init.g.slice();need=new Set(init.n);moves=0;sfx.whoosh();paint(-1);return}
  const i=cs.indexOf(b);press(i);moves++;sfx.bell(i%6);buzz(8);paint(-1);
  if(g.every(v=>v)){over=true;sfx.win();const [lx,ly]=rel($('.lg',R));burstAt(lx,ly,36,['#ffe7a0','#ff9f1c','#fff']);
   const opt=init.n.length,s=Math.max(1,(moves<=opt+2?3:moves<=opt+8?2:1)-hints);
   G.later(()=>done({stars:s,line:t('lE',{m:moves})+(hints?' · '+t('lHn',{h:hints}):'')}),1000)}});
};
