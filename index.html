<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Deepa Quest: a journey of lights. Discover why Diwali is celebrated across India and the world through stories and quick mini-games.">
<title>Deepa Quest · A Journey of Lights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#140b24;--p2:#2c1c49;--line:#41306a;--gold:#ffc24b;--rose:#ff5d7a;--ok:#4fdc9b;--tx:#fff4e0;--mu:#bba9d4;--hud:calc(62px + env(safe-area-inset-top))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07040d;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
@media (min-width:600px) and (min-height:700px){#app{height:min(100dvh - 40px,900px);border-radius:28px;box-shadow:0 0 0 1px #2d1d4a,0 30px 90px #000c}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scr{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;border-radius:16px;background:var(--p2);border:1px solid var(--line);font-weight:800;font-size:1rem;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,#ffcf5a,#ff8a1f 55%,#ff4e50);border:0;color:#2a0f00;box-shadow:0 5px 0 #a33a00,0 10px 26px #ff7a1855}
.btn.pri:active{transform:translateY(4px);box-shadow:0 1px 0 #a33a00}
.btn.ghost{background:transparent;border-color:#ffffff2a}
.row{display:flex;gap:10px;width:100%}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.ib{flex:none;width:42px;height:42px;border-radius:14px;background:#ffffff17;display:grid;place-items:center;font-size:1.1rem}
.ib:active{transform:scale(.92)}
.chip{flex:none;height:34px;padding:0 12px;border-radius:99px;background:#ffffff17;display:grid;place-items:center;font-weight:800;font-size:.88rem}
/* title */
#s-title{align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(90% 55% at 50% 105%,#ff8a1f40,transparent 70%),radial-gradient(circle at 50% 15%,#3d2068,var(--bg) 70%)}
.sky{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 42% 28%,#fffa,transparent),radial-gradient(1.2px 1.2px at 88% 38%,#fff,transparent),radial-gradient(1.6px 1.6px at 22% 46%,#fffa,transparent),radial-gradient(1.2px 1.2px at 64% 8%,#fff,transparent),radial-gradient(1.3px 1.3px at 6% 64%,#fff8,transparent),radial-gradient(1.3px 1.3px at 94% 70%,#fff8,transparent);animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.4}}
.tc{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}
.bigdiya{font-size:92px;line-height:1;filter:drop-shadow(0 0 28px #ff9d2e);animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) scale(1.04)}}
.logo{font-size:clamp(2.2rem,11vw,3rem);font-weight:900;letter-spacing:-1px;margin-top:10px;background:linear-gradient(180deg,#fff3c4,#ffb22e 55%,#ff6a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mu);margin:4px 0 30px}
.foot{margin-top:22px;font-size:.78rem;color:var(--mu)}
/* map */
#s-map{background:linear-gradient(180deg,#44200f 0%,#3a1c3c 30%,#26305e 52%,#0f4a63 66%,#1c2a5c 82%,#0a0614 100%)}
.mhead{flex:none;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#140b24f2;border-bottom:1px solid #ffffff14;z-index:3}
.mlogo{flex:1;font-weight:900;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mapw{position:relative;width:100%}
.mapw svg{position:absolute;left:0;top:0;pointer-events:none}
.pb{fill:none;stroke:#ffffff35;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 14}
.pl{fill:none;stroke:#ffc24b;stroke-width:7;stroke-linecap:round;stroke-dasharray:1 14}
.node{position:absolute;width:124px;transform:translate(-50%,-37px);display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.orb{position:relative;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 32% 28%,#ffffff60,transparent 42%),var(--c);border:3px solid #ffffff60;box-shadow:0 6px 0 #00000070}
.node.done .orb{border-color:var(--gold);box-shadow:0 6px 0 #00000070,0 0 26px #ffc24b90}
.node.cur .orb{border-color:#fff;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 6px 0 #00000070,0 0 0 0 #ffc24bcc}100%{box-shadow:0 6px 0 #00000070,0 0 0 18px #ffc24b00}}
.node.lock .orb{filter:grayscale(1) brightness(.5)}
.node.new .orb{animation:unlock .8s cubic-bezier(.2,1.6,.4,1),pulse 1.5s .8s infinite}
@keyframes unlock{0%{transform:scale(.3) rotate(-30deg)}}
.nm{font-size:.8rem;font-weight:800;line-height:1.15;text-shadow:0 2px 6px #000,0 0 2px #000}
.st{font-size:.85rem;color:var(--gold);letter-spacing:2px;min-height:1em;text-shadow:0 1px 4px #000}
.lk{position:absolute;right:-4px;top:-4px;font-size:18px}
.now{position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a0f00;font-weight:900;font-size:.68rem;letter-spacing:1px;padding:4px 9px;border-radius:99px;box-shadow:0 3px 10px #0008;animation:nowb 1.1s ease-in-out infinite}
@keyframes nowb{50%{transform:translate(-50%,-5px)}}
.chap{position:absolute;left:50%;transform:translate(-50%,-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.7rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;background:#0000006b;border:1px solid #ffffff2e;padding:7px 14px;border-radius:99px}
.deco{position:absolute;transform:translate(-50%,-50%);font-size:30px;opacity:.45;pointer-events:none}
/* story */
#s-story{background:var(--sbg);cursor:pointer}
.sbars{flex:none;display:flex;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.sbars i{flex:1;height:3px;border-radius:3px;background:#ffffff40}
.sbars i.f{background:#fff}
.stop{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 12px}
.place{font-size:.78rem;font-weight:800;background:#00000059;padding:7px 11px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sart{flex:1;min-height:0;display:grid;place-items:center;text-align:center;line-height:1.15;padding:10px}
.sart>span{display:block;animation:artIn .5s cubic-bezier(.2,1.4,.4,1),float 3.2s .5s ease-in-out infinite;filter:drop-shadow(0 12px 24px #000a)}
@keyframes artIn{from{opacity:0;transform:scale(.6) translateY(20px)}}
@keyframes float{50%{transform:translateY(-8px)}}
.stext{flex:none;margin:0 12px calc(14px + env(safe-area-inset-bottom));background:#0c0717e6;border:1px solid #ffffff1f;border-radius:22px;padding:16px 16px 12px;font-size:1.08rem;line-height:1.5;animation:txIn .35s ease}
@keyframes txIn{from{opacity:0;transform:translateY(12px)}}
.who{display:block;font-size:.72rem;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.tn{display:block;text-align:right;font-size:.75rem;color:var(--mu);margin-top:8px;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.35}}
.mis{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 20px calc(20px + env(safe-area-inset-bottom));gap:12px;cursor:default}
.mis .bigdiya{font-size:84px}
.mt{font-size:.8rem;font-weight:900;letter-spacing:2px;color:var(--gold)}
.mx{font-size:1.2rem;font-weight:800;line-height:1.4;max-width:330px}
.mgoal{font-size:.85rem;color:var(--mu);margin-bottom:6px}
/* game shell */
#s-game{background:#05030a}
#g-stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
.ghud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(#000000b3,#0000);pointer-events:none}
.ghud .ib{pointer-events:auto}
.gmid{flex:1;min-width:0}
.gname{font-size:.72rem;font-weight:800;color:#fffd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.gbar{height:8px;border-radius:8px;background:#ffffff2b;overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#ffe066,#ff8a1f);border-radius:8px;transform-origin:left center}
.gbar.low i{background:linear-gradient(90deg,#ff8a9b,#ff2d55)}
.gchip{flex:none;height:34px;min-width:40px;padding:0 10px;border-radius:12px;background:#ffffff21;display:grid;place-items:center;font-weight:900;font-size:.85rem;white-space:nowrap}
.cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.field{position:absolute;left:0;right:0;bottom:0;top:var(--hud)}
.ready{position:absolute;inset:0;z-index:6;display:grid;place-items:center;font-size:3.2rem;font-weight:900;text-shadow:0 6px 30px #000;animation:popIn .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.gdeco{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:40px;opacity:.3;letter-spacing:8px;pointer-events:none;white-space:nowrap;overflow:hidden}
.pop{position:absolute;z-index:7;transform:translate(-50%,-50%);font-weight:900;font-size:1.25rem;pointer-events:none;text-shadow:0 2px 8px #000;animation:popUp .9s ease-out forwards;white-space:nowrap}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%)}}
.pop.good{color:#ffe066}.pop.bad{color:#ff5d7a}.pop.big{font-size:1.8rem}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;animation:fl .4s forwards}
@keyframes fl{from{opacity:.5}to{opacity:0}}
.shakeit{animation:shk .3s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
.paused,.paused *{animation-play-state:paused!important}
/* tap */
.tgt{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;font-size:46px;line-height:1;display:grid;place-items:center;animation:tIn .25s cubic-bezier(.2,1.7,.4,1);transition:opacity .25s,transform .25s,filter .2s}
@keyframes tIn{from{transform:scale(0)}}
.tgt.dim{filter:grayscale(1) brightness(.6)}
.tgt.lit{filter:drop-shadow(0 0 16px #ffb52e) brightness(1.2);transform:scale(1.4)}
.tgt.out{transform:scale(.4);opacity:0}
.tgt.boom{transform:scale(1.3) rotate(25deg);filter:drop-shadow(0 0 14px #ff2d55)}
/* rhythm */
.rh{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.l14{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:290px;font-size:22px;margin-bottom:22px}
.l14 span{filter:grayscale(1) brightness(.35);transition:filter .3s}
.l14 span.on{filter:drop-shadow(0 0 8px #ffb52e)}
.rw{position:relative;width:min(62vw,250px);aspect-ratio:1}
.rtg{position:absolute;inset:0;border-radius:50%;border:6px solid #ffc24b;display:grid;place-items:center;font-size:clamp(64px,22vw,100px);background:radial-gradient(circle,#ff3b3b33,transparent 70%);box-shadow:0 0 34px #ff3b3b55}
.rtg.hit{animation:hitp .14s}
@keyframes hitp{50%{transform:scale(.93)}}
.ring{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;pointer-events:none;will-change:transform,opacity}
.rj{height:44px;font-size:1.7rem;font-weight:900;margin-top:20px}
.rj.hit{animation:hitp2 .25s}
@keyframes hitp2{from{transform:scale(1.35)}}
.rsub{font-size:.85rem;color:var(--mu)}
/* swipe */
.sw{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.deck{position:relative;width:min(84vw,330px);height:min(52vh,370px)}
.sc{position:absolute;inset:0;border-radius:24px;background:linear-gradient(160deg,#fff7e6,#ffe1b0);color:#2a1400;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-shadow:0 14px 30px #0008;will-change:transform;touch-action:none}
.sc:not(.back){animation:deal .22s ease-out}
@keyframes deal{from{transform:scale(.94) translateY(14px)}}
.sc.back{transform:scale(.94) translateY(14px);filter:brightness(.75)}
.se{font-size:56px;margin-bottom:14px}
.sq{font-size:1.2rem;font-weight:800;line-height:1.35}
.sn{position:absolute;bottom:14px;font-size:.75rem;font-weight:800;opacity:.5}
.lbl{position:absolute;top:18px;padding:6px 12px;border-radius:10px;font-weight:900;border:3px solid;opacity:0}
.lbl.t{right:18px;color:#13a35b;transform:rotate(12deg)}
.lbl.f{left:18px;color:#e0244a;transform:rotate(-12deg)}
.swb{display:flex;gap:30px;margin-top:18px}
.swb button{width:66px;height:66px;border-radius:50%;font-size:26px;background:#ffffff1a;border:2px solid #ffffff33}
.swb .yes{color:var(--ok)}.swb .no{color:var(--rose)}
.why{min-height:3.2em;margin-top:14px;text-align:center;font-size:.95rem;max-width:340px;line-height:1.4}
.why.good{color:#7dffb8}.why.bad{color:#ff9aac}
/* rangoli */
.rg{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
.rgt{font-weight:900;font-size:1.05rem}
.rgrid{position:relative;display:grid;gap:4px;width:min(94vw,400px);padding:10px;border-radius:18px;background:#ffffff0d;border:1px solid #ffffff1f}
.rgrid::after{content:"";position:absolute;top:4px;bottom:4px;left:50%;border-left:2px dashed #ffffffa0;pointer-events:none}
.rgrid.win{box-shadow:0 0 40px #ffc24b99;border-color:var(--gold)}
.rc{aspect-ratio:1;border-radius:9px;background:#ffffff14;border:1px solid #ffffff1a;transition:transform .1s}
.rc:active{transform:scale(.88)}
.rc.lh{pointer-events:none}
.rpal{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--mu)}
.rpal i{width:18px;height:18px;border-radius:5px;display:inline-block;border:1px solid #ffffff40}
.rhint{min-height:1.3em;font-weight:800;color:var(--gold)}
/* quiz */
.qz{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
.ql{display:flex;justify-content:center;gap:6px;font-size:18px}
.ql span{filter:grayscale(1) brightness(.4)}
.ql span.y{filter:drop-shadow(0 0 6px #ffb52e)}
.ql span.n{opacity:.25}
.qn{text-align:center;color:var(--mu);font-size:.75rem;font-weight:900;letter-spacing:1.5px}
.qq{font-size:clamp(1.15rem,5.2vw,1.45rem);font-weight:900;text-align:center;line-height:1.35;min-height:3em;display:grid;place-items:center;animation:txIn .3s}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qo{min-height:92px;border-radius:18px;background:#ffffff17;border:2px solid #ffffff26;padding:10px 8px;font-weight:800;font-size:.95rem;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .1s,background .2s}
.qo:active{transform:scale(.95)}
.qo .e{font-size:34px;line-height:1}
.qo.ok{background:#1d7a4c;border-color:var(--ok)}
.qo.no{background:#7c1d33;border-color:var(--rose)}
.qw{min-height:3em;text-align:center;font-size:.92rem;line-height:1.4}
/* simon */
.sm{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.si{font-size:1.25rem;font-weight:900;min-height:1.5em;text-align:center}
.arch{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(88vw,340px);padding:30px 16px 18px;border:7px solid #b8862f;border-bottom:0;border-radius:170px 170px 0 0;background:linear-gradient(#ffffff08,#0000)}
.pad{aspect-ratio:1;border-radius:50% 50% 16px 16px;background:#2a1a08;border:3px solid #6e5122;font-size:42px;display:grid;place-items:center;filter:grayscale(.9) brightness(.55);transition:filter .12s,transform .12s,box-shadow .12s}
.pad.on{filter:none;transform:scale(1.1);box-shadow:0 0 34px var(--pc),inset 0 0 20px var(--pc);border-color:var(--pc)}
.ss{font-size:.85rem;color:var(--mu);text-align:center}
/* memory */
.mm{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
.mgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(94vw,400px)}
.mcd{aspect-ratio:3/4;perspective:700px;padding:0}
.mcd .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcd.f .in{transform:rotateY(180deg)}
.mcd .fa,.mcd .ba{position:absolute;inset:0;border-radius:12px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;text-align:center}
.mcd .ba{background:linear-gradient(135deg,#ff8a1f,#c2185b);border:2px solid #ffffff55;font-size:26px}
.mcd .fa{transform:rotateY(180deg);background:#fff6e3;color:#2a1400;font-weight:800;font-size:.7rem;line-height:1.2;word-break:break-word}
.mcd .fa .e{font-size:26px;margin-bottom:4px}
.mcd.m .fa{background:#dcffeb;box-shadow:inset 0 0 0 3px #4fdc9b}
/* lights */
.lo{position:absolute;left:0;right:0;bottom:0;top:var(--hud);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px}
.lg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(86vw,330px)}
.lc{aspect-ratio:1;border-radius:16px;background:#1b1430;border:2px solid #392c57;font-size:32px;display:grid;place-items:center;transition:background .15s,box-shadow .15s}
.lc span{filter:grayscale(1) brightness(.45);transition:filter .15s}
.lc.on{background:radial-gradient(circle,#ffe7a0,#ff9f1c 75%);border-color:#ffd166;box-shadow:0 0 22px #ffb52e88}
.lc.on span{filter:none}
.lc.hint{outline:3px dashed #fff;outline-offset:3px}
.lrow{display:flex;gap:10px;width:min(86vw,330px)}
/* modal, album, toast */
.modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#07030fe6}
.modal.on{display:flex;animation:fadeIn .2s}
.mcard{width:100%;max-width:370px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#2e1d4d,#1a0f2e);border:1px solid #ffffff26;border-radius:26px;padding:22px 16px 16px;text-align:center;animation:popIn .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes popIn{from{opacity:0;transform:scale(.75)}}
.rt{font-size:1.7rem;font-weight:900;background:linear-gradient(180deg,#fff3c4,#ffb22e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rst{display:flex;justify-content:center;align-items:flex-end;gap:6px;font-size:48px;margin:10px 0 4px;height:72px}
.rst span{filter:grayscale(1) brightness(.35);transform:scale(.7);transition:transform .4s cubic-bezier(.2,1.8,.4,1),filter .3s}
.rst span.on{filter:drop-shadow(0 0 12px #ffc24b);transform:scale(1)}
.rst span:nth-child(2){margin-bottom:14px}

<script>
/* ===================== Deepa Quest · single-file build ===================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const any=a=>a[Math.floor(Math.random()*a.length)];
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e};
const starTxt=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const app=$('#app'),gst=$('#g-stage'),DPR=Math.min(2,window.devicePixelRatio||1);
const E={}; // mini-game engines (defined further down)

/* ---------- save ---------- */
const KEY='deepa-quest-v2',save={stars:{},snd:true,hap:true,seen:false};
try{Object.assign(save,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ---------- sound + haptics (pure Web Audio, no files) ---------- */
let AC=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C){try{AC=new C()}catch(e){}}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,delay,slide){if(!save.snd)return;const a=actx();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.1,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
const sfx={
 tap:()=>{tone(880,.08,'triangle',.09);tone(1320,.1,'sine',.05,.03)},
 good:()=>{tone(660,.1,'sine',.11);tone(990,.16,'sine',.09,.07)},
 bad:()=>tone(200,.25,'sawtooth',.07,0,90),
 drum:()=>tone(150,.2,'sine',.3,0,55),
 tick:()=>tone(1700,.03,'square',.025),
 thunder:()=>tone(70,.7,'sawtooth',.05,0,35),
 bell:i=>tone([523,587,659,784,880,1047][i%6],.32,'triangle',.12),
 star:i=>tone(880+i*220,.25,'sine',.12),
 whoosh:()=>tone(400,.14,'sine',.04,0,1200),
 win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.1,i*.11))
};
const buzz=ms=>{if(save.hap&&navigator.vibrate){try{navigator.vibrate(ms)}catch(e){}}};

/* ---------- particles ---------- */
const fx=$('#fx'),fc=fx.getContext('2d');let parts=[],fxRun=false,fxT=0;
function fxSize(){const r=app.getBoundingClientRect();fx.width=Math.round(r.width*DPR);fx.height=Math.round(r.height*DPR);fc.setTransform(DPR,0,0,DPR,0,0)}
function burst(cx,cy,n,cols){const r=app.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;cols=cols||['#ffd166','#ff8a1f','#fff3b0','#ff5d7a'];n=n||14;
 for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(90,330);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,l:1,d:rnd(.45,.95),c:cols[i%cols.length],r:rnd(2,4.6)})}
 if(!fxRun){fxRun=true;fxT=performance.now();requestAnimationFrame(fxLoop)}}
function fxLoop(t){const dt=Math.min(.05,(t-fxT)/1000);fxT=t;fc.clearRect(0,0,fx.width,fx.height);
 parts=parts.filter(p=>(p.l-=dt/p.d)>0);
 for(const p of parts){p.vy+=520*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;fc.globalAlpha=p.l;fc.fillStyle=p.c;fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.283);fc.fill()}
 fc.globalAlpha=1;if(parts.length)requestAnimationFrame(fxLoop);else{fxRun=false;fc.clearRect(0,0,fx.width,fx.height)}}
function confetti(){const r=app.getBoundingClientRect();for(let i=0;i<6;i++)setTimeout(()=>burst(r.left+rnd(.15,.85)*r.width,r.top+rnd(.12,.45)*r.height,24,['#ffd166','#ff5d7a','#4fdc9b','#7cc6ff','#c084fc','#fff']),i*150)}

/* ---------- pausable game clock ---------- */
const G={raf:0,tick:null,paused:false,ps:0,off:0,tos:[],cleanup:null,onResize:null,
 now(){return(this.paused?this.ps:performance.now())-this.off},
 loop(fn){cancelAnimationFrame(this.raf);this.tick=fn;const f=()=>{this.raf=requestAnimationFrame(f);if(!this.paused&&this.tick)this.tick(this.now())};this.raf=requestAnimationFrame(f)},
 later(fn,ms){const id=setTimeout(fn,ms);this.tos.push(id);return id},
 reset(){cancelAnimationFrame(this.raf);this.raf=0;this.tick=null;this.tos.forEach(clearTimeout);this.tos=[];this.paused=false;this.off=0;this.onResize=null;gst.classList.remove('paused');const c=this.cleanup;this.cleanup=null;if(c){try{c()}catch(e){}}},
 pause(){if(this.paused)return;this.paused=true;this.ps=performance.now();gst.classList.add('paused')},
 resume(){if(!this.paused)return;this.off+=performance.now()-this.ps;this.paused=false;gst.classList.remove('paused')}
};
const gBar=$('#g-bar'),gTime=$('#g-time'),gScore=$('#g-score'),gLives=$('#g-lives'),gName=$('#g-name');

 score:t=>{gScore.textContent=t;gScore.style.display=t?'':'none'},

};
function pop(t,x,y,c){const e=h('div','pop '+(c||'good'),t);e.style.left=x+'px';e.style.top=y+'px';gst.appendChild(e);setTimeout(()=>e.remove(),950)}
function flash(col){const e=h('div','flash');e.style.background=col||'#ff2d55';gst.appendChild(e);setTimeout(()=>e.remove(),420)}
function shakeEl(el){el.classList.remove('shakeit');void el.offsetWidth;el.classList.add('shakeit')}
function burstAt(x,y,n,cols){const r=gst.getBoundingClientRect();burst(r.left+x,r.top+y,n,cols)}

/* ---------- canvas + cached emoji sprites ---------- */
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',SPR={};
function sprite(ch,sz){const k=ch+'|'+sz;if(SPR[k])return SPR[k];const s=sz*1.35,c=document.createElement('canvas');c.width=c.height=Math.ceil(s*DPR);const x=c.getContext('2d');x.scale(DPR,DPR);x.font=`${sz}px ${EF}`;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,s/2,s/2+sz*.06);c.s=s;return SPR[k]=c}
function spr(ctx,ch,sz,x,y,rot,a){const c=sprite(ch,Math.round(sz));ctx.save();if(a!=null&&a<1)ctx.globalAlpha=Math.max(0,a);ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.drawImage(c,-c.s/2,-c.s/2,c.s,c.s);ctx.restore()}
function makeCanvas(el){const c=h('canvas','cv');el.appendChild(c);const ctx=c.getContext('2d'),K={c,ctx,W:0,H:0,fit(){const r=el.getBoundingClientRect();K.W=r.width;K.H=r.height;c.width=Math.round(r.width*DPR);c.height=Math.round(r.height*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}};K.fit();G.onResize=K.fit;return K}

 const S=$('#s-map');

 LV.forEach((l,i)=>{if(l.chap){y+=i?40:0;html+=`<div class="chap" style="top:${y}px">${l.chap}</div>`;y+=92}
  const xf=xs[i%4];pts.push({x:Math.round(W*xf),y});

  y+=128});
 const H=y+20,c=LV.findIndex((l,i)=>unlocked(i)&&!(save.stars[l.id]>0)),reach=c<0?LV.length-1:c;
 const path=n=>pts.slice(0,n+1).map((p,i,a)=>{if(!i)return`M${p.x} ${p.y}`;const q=a[i-1],m=(q.y+p.y)/2;return`C${q.x} ${m} ${p.x} ${m} ${p.x} ${p.y}`}).join(' ');
 html=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><path class="pb" d="${path(LV.length-1)}"/><path class="pl" d="${path(reach)}"/></svg>`+html;
 LV.forEach((l,i)=>{const p=pts[i],s=save.stars[l.id]||0,lk=!unlocked(i),cls=lk?'lock':s?'done':'cur';
  html+=`<button class="node ${cls}${i===justUnlocked?' new':''}" style="left:${p.x}px;top:${p.y}px;--c:${l.color}" data-i="${i}" aria-label="${l.name}">${i===c?'<span class="now">PLAY</span>':''}<span class="orb">${l.icon}${lk?'<span class="lk">🔒</span>':''}</span><span class="nm">${l.name}</span><span class="st">${lk?'':starTxt(s)}</span></button>`});
 wrap.style.height=H+'px';wrap.innerHTML=html;

  :`<div class="mis"><div class="bigdiya">${L.icon}</div><div class="mt">🎯 YOUR MISSION</div><div class="mx">${L.mission}</div><div class="mgoal">${L.goalText}${save.stars[L.id]?` · Best ${starTxt(save.stars[L.id])}`:''}</div><div class="stack" style="max-width:320px"><button class="btn pri" id="sp">▶ Play</button><button class="btn ghost" id="sr">↺ Read the story again</button></div></div>`;

 $('#sx').onclick=e=>{e.stopPropagation();sfx.tap();goMap()};
 if(!mis){S.onclick=e=>{if(e.target.closest('#sx'))return;const r=S.getBoundingClientRect();if(e.clientX-r.left<r.width*.28&&cur.p>0)cur.p--;else cur.p++;sfx.tap();if(L.pro&&cur.p>=P.length){goMap();return}renderStory()}}
 else{S.onclick=null;$('#sp').onclick=()=>{sfx.good();startGame(L,i)};$('#sr').onclick=()=>{cur.p=0;renderStory()}}

function startGame(L,i){
 if(!E[L.game.type]){toast('⚠️ Game not found');return}

 gst.innerHTML='';gst.className='';gst.style.background=L.gbg;
 HUD.name(`${L.name} · ${L.goalText}`);HUD.time(1);HUD.score('');HUD.lives(null);
 if(L.gdeco)gst.appendChild(h('div','gdeco',L.gdeco));

 let fired=false;
 G.later(()=>{rd.remove();E[L.game.type](gst,L.game,res=>{if(fired)return;fired=true;G.reset();showResult(L,i,res)})},1150);
}

function field(st,cls){const r=h('div',cls||'field');st.appendChild(r);return r}
function rel(el){const r=el.getBoundingClientRect(),s=gst.getBoundingClientRect();return[r.left-s.left+r.width/2,r.top-s.top+r.height/2]}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function keys(fn){const k=e=>{if(!G.paused&&!$('#modal').classList.contains('on'))fn(e)};addEventListener('keydown',k);G.cleanup=()=>removeEventListener('keydown',k)}

/* 1 · TAP: light diyas / free kings */
E.tap=(st,c,done)=>{
 const F=field(st),T=c.time*1000,t0=G.now(),live=[];
 let hits=0,miss=0,combo=0,pen=0,iv=c.spawn,next=0,over=false;
 HUD.score(`${c.good} 0/${c.goal}`);
 const kill=(o,cls,ms)=>{o.dead=1;live.splice(live.indexOf(o),1);o.e.classList.add(cls);setTimeout(()=>o.e.remove(),ms||260)};
 const end=win=>{if(over)return;over=true;const acc=Math.round(hits*100/Math.max(1,hits+miss));
  G.later(()=>done({stars:win?(acc>=90?3:acc>=75?2:1):0,line:`${hits}/${c.goal} ${c.unit} · ${acc}% accuracy`}),500)};
 function spawn(now){const W=F.clientWidth,H=F.clientHeight;let x,y,k=0;

  obs.forEach(l=>objs.push({l,y:-40,t:Math.random()<.5?'⛈️':'🌀',o:1}));
  const free=[0,1,2].filter(l=>!obs.includes(l));if(Math.random()<.65)objs.push({l:any(free),y:-40,t:'🪔',o:0})}
 G.loop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const W=K.W,H=K.H,el=now-t0,p=clamp(el/T,0,1),sp=260+p*220,sy=H-110;
  dist+=sp*dt;
  if(!over){HUD.time(1-p);
   if(ms<3&&p>=TH[ms]){pop(MS[ms],W/2,F.offsetTop+H*.32,'good big');ms++}
   if(el>=T){over=true;won=now;sfx.win();G.later(()=>done({stars:lives,line:`Safe ashore with ${lamps} lamps of home`}),1400)}
   else if(now>=next){row();next=now+Math.max(430,820-p*390)}}
  sx+=(LX(lane)-sx)*Math.min(1,dt*14);
  for(const o of objs){o.y+=sp*dt;
   if(over||o.hit||o.l!==lane||Math.abs(o.y-sy)>38)continue;
   if(!o.o){o.hit=1;lamps++;HUD.score(`🪔 ${lamps}`);sfx.good();buzz(10);burstAt(LX(o.l),o.y+F.offsetTop,10);continue}
   if(now<inv)continue;
   o.hit=1;lives--;inv=now+1200;HUD.lives(lives);sfx.bad();buzz(150);flash('#3aa0ff');shakeEl(F);
   if(lives<=0){over=true;G.later(()=>done({stars:0,line:'The storm was too strong this time'}),800)}}
  for(let i=objs.length-1;i>=0;i--){const o=objs[i];if(o.y>H+60||(o.hit&&!o.o))objs.splice(i,1)}
  x.clearRect(0,0,W,H);
  x.strokeStyle='rgba(180,230,255,.16)';x.lineWidth=2;
  for(let i=0;i<9;i++){const y=(dist*.6+i*H/9)%H;x.beginPath();for(let xx=0;xx<=W;xx+=24)x.lineTo(xx,y+Math.sin(xx/38+i*1.7)*5);x.stroke()}
  x.setLineDash([14,22]);x.lineDashOffset=-dist;x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.moveTo(W*.35,0);x.lineTo(W*.35,H);x.moveTo(W*.65,0);x.lineTo(W*.65,H);x.stroke();x.setLineDash([]);
  if(won)spr(x,'🏝️',110,W/2,Math.min(H*.3,-60+(now-won)*.4));
  for(const o of objs){const X=LX(o.l);
   if(o.o)spr(x,o.t,o.t==='🌀'?50:54,X,o.y,o.t==='🌀'?now/250:0,o.hit?.45:1);
   else{x.fillStyle='rgba(255,190,60,.22)';x.beginPath();x.arc(X,o.y,26,0,6.283);x.fill();spr(x,'🪔',34,X,o.y)}}
  spr(x,'🚢',62,sx,sy,0,now<inv&&Math.floor(now/100)%2?.3:1)});
};

/* 9 · SIMON: bamboo deya patterns */
E.simon=(st,c,done)=>{
 const R=field(st,'sm'),P=['#ffd166','#ff6b6b','#4dabf7','#69db7c','#da77f2','#ffa94d'];
 R.innerHTML=`<div class="si">Watch the deyas…</div><div class="arch">${P.map((cl,i)=>`<button class="pad" data-i="${i}" style="--pc:${cl}">🪔</button>`).join('')}</div><div class="ss"></div>`;
 const pads=$$('.pad',R),si=$('.si',R),ss=$('.ss',R),seq=[];let pos=0,inp=false,lives=3,round=0,over=false;
 HUD.time(null);HUD.lives(3);HUD.score(`🎋 0/${c.goal}`);
 const glow=(i,ms)=>{pads[i].classList.add('on');sfx.bell(i);G.later(()=>pads[i].classList.remove('on'),ms)};
 function play(){inp=false;pos=0;si.textContent='Watch the deyas…';const on=Math.max(300,540-round*35),gap=Math.max(110,200-round*14);
  seq.forEach((v,k)=>G.later(()=>glow(v,on),600+k*(on+gap)));
  G.later(()=>{inp=true;si.textContent='Your turn! 👆'},600+seq.length*(on+gap))}
 function nextRound(){round++;while(seq.length<round+2)seq.push(ri(0,5));ss.textContent=`Pattern ${round} of ${c.goal} · ${seq.length} deyas`;play()}
 R.addEventListener('pointerdown',e=>{const b=e.target.closest('.pad');if(!b||!inp||over||G.paused)return;const i=+b.dataset.i;glow(i,220);buzz(10);
  if(i===seq[pos]){if(++pos<seq.length)return;inp=false;si.textContent='✨ Beautiful!';sfx.good();const [bx,by]=rel(b);burstAt(bx,by,14);HUD.score(`🎋 ${round}/${c.goal}`);
   if(round>=c.goal){over=true;G.later(()=>done({stars:lives,line:`All ${c.goal} bamboo patterns glowing`}),900)}else G.later(nextRound,900);return}
  inp=false;lives--;HUD.lives(lives);sfx.bad();buzz(120);flash();shakeEl($('.arch',R));
  if(lives<=0){over=true;si.textContent='The deyas went dark…';G.later(()=>done({stars:0,line:`Reached pattern ${round} of ${c.goal}`}),1000)}
  else{si.textContent='Oops! Watch again…';G.later(play,1100)}});
 nextRound();
};

/* 10 · MEMORY: open-house word match */
E.memory=(st,c,done)=>{
 const R=field(st,'mm'),T=75000,t0=G.now(),np=c.pairs.length,deck=[];
 c.pairs.forEach((p,k)=>deck.push({k,f:`<span class="e">${p[0]}</span>${p[1]}`},{k,f:`<span class="e">💬</span>${p[2]}`}));
 const D=shuffle(deck);
 R.innerHTML=`<div class="mgr">${D.map((d,i)=>`<button class="mcd f" data-i="${i}"><div class="in"><div class="ba">🪔</div><div class="fa">${d.f}</div></div></button>`).join('')}</div><div class="why">Memorise the cards…</div>`;
 const why=$('.why',R);let open=[],got=0,moves=0,lock=true,over=false;
 HUD.score(`🃏 0/${np}`);
 G.later(()=>{$$('.mcd',R).forEach(e=>e.classList.remove('f'));lock=false;why.textContent='Match each word with its meaning'},2000);
 R.addEventListener('pointerdown',e=>{const b=e.target.closest('.mcd');if(!b||lock||over||G.paused||b.classList.contains('f'))return;
  b.classList.add('f');sfx.tap();open.push(b);if(open.length<2)return;
  moves++;const [a,z]=open,ka=D[+a.dataset.i].k,kz=D[+z.dataset.i].k;open=[];
  if(ka===kz){got++;a.classList.add('m');z.classList.add('m');sfx.good();buzz(15);const p=c.pairs[ka];why.className='why good';why.innerHTML=`✅ ${p[0]} <b>${p[1]}</b> = ${p[2]}`;HUD.score(`🃏 ${got}/${np}`);const [bx,by]=rel(z);burstAt(bx,by,10);
   if(got===np){over=true;sfx.win();G.later(()=>done({stars:moves<=10?3:moves<=15?2:1,line:`All ${np} pairs matched in ${moves} moves`}),900)}}
  else{lock=true;sfx.tick();buzz(30);G.later(()=>{a.classList.remove('f');z.classList.remove('f');lock=false},750)}});
 G.loop(now=>{if(over)return;const f=1-(now-t0)/T;HUD.time(f);if(f<=0){over=true;done({stars:0,line:`${got}/${np} pairs before time ran out`})}});
};

/* 11 · LIGHTS: Golden Mile switch-on puzzle */
E.lights=(st,c,done)=>{
 const R=field(st,'lo');let g=[],need=new Set(),init=null,moves=0,hints=0,over=false;
 R.innerHTML=`<div class="si">Switch on the Golden Mile!</div><div class="lg">${'<button class="lc"><span>💡</span></button>'.repeat(16)}</div><div class="lrow"><button class="btn" data-a="h">💡 Hint</button><button class="btn" data-a="r">↺ Reset</button></div><div class="ss">Each tap flips a light and its 4 neighbours</div>`;
 const cs=$$('.lc',R),si=$('.si',R);HUD.time(null);
 const press=i=>{const r=i>>2,k=i&3;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const y=r+a,z=k+b;if(y>=0&&y<4&&z>=0&&z<4)g[y*4+z]^=1});need.has(i)?need.delete(i):need.add(i)};
 const paint=hi=>{cs.forEach((e,i)=>{e.classList.toggle('on',!!g[i]);e.classList.toggle('hint',i===hi)});HUD.score(`💡 ${g.filter(v=>v).length}/16`);si.textContent=moves?`Moves: ${moves}${hints?` · Hints: ${hints}`:''}`:'Switch on the Golden Mile!'};
 do{g=Array(16).fill(1);need=new Set();for(let k=0;k<6;k++)press(ri(0,15))}while(need.size<3||g.every(v=>v));
 init={g:g.slice(),n:[...need]};paint(-1);
 R.addEventListener('pointerdown',e=>{if(over||G.paused)return;const b=e.target.closest('.lc,[data-a]');if(!b)return;
  if(b.dataset.a==='h'){hints++;sfx.tick();paint([...need][0]);return}
  if(b.dataset.a==='r'){g=init.g.slice();need=new Set(init.n);moves=0;sfx.whoosh();paint(-1);return}
  const i=cs.indexOf(b);press(i);moves++;sfx.bell(i%6);buzz(8);paint(-1);
  if(g.every(v=>v)){over=true;sfx.win();const [lx,ly]=rel($('.lg',R));burstAt(lx,ly,36,['#ffe7a0','#ff9f1c','#fff']);
   const opt=init.n.length,s=Math.max(1,(moves<=opt+2?3:moves<=opt+8?2:1)-hints);
   G.later(()=>done({stars:s,line:`All 16 lights on in ${moves} moves${hints?` · ${hints} hint${hints>1?'s':''}`:''}`}),1000)}});
};
